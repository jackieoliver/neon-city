<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Digital Rain | Cyberpunk Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            cursor: crosshair;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        #info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #00ff41;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            pointer-events: none;
            text-shadow: 0 0 10px #00ff41;
            z-index: 10;
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.4) 100%);
            z-index: 5;
        }

        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1) 0px,
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            z-index: 6;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div class="vignette"></div>
    <div class="scanlines"></div>
    <div id="info">Move mouse to disturb the code stream</div>

    <script>
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');

        let width, height;
        let columns;
        let streams = [];
        let mouseX = -1000;
        let mouseY = -1000;
        let ripples = [];
        let lastTime = 0;
        const targetFPS = 60;
        const frameInterval = 1000 / targetFPS;

        // Character sets
        const katakana = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
        const numbers = '0123456789';
        const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?/~`';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const allChars = katakana + numbers + symbols + latin;

        // Colors
        const matrixGreen = '#00ff41';
        const cyberpunkPink = '#ff2a6d';
        const brightGreen = '#7fff7f';

        class Drop {
            constructor(x, y, speed, isHead = false, isImportant = false) {
                this.x = x;
                this.y = y;
                this.speed = speed;
                this.char = this.randomChar();
                this.isHead = isHead;
                this.isImportant = isImportant;
                this.changeTimer = 0;
                this.changeInterval = Math.random() * 10 + 5;
            }

            randomChar() {
                return allChars[Math.floor(Math.random() * allChars.length)];
            }

            update(deltaTime) {
                this.changeTimer += deltaTime;
                if (this.changeTimer > this.changeInterval) {
                    this.char = this.randomChar();
                    this.changeTimer = 0;
                    this.changeInterval = Math.random() * 10 + 5;
                }
            }
        }

        class Stream {
            constructor(x) {
                this.x = x;
                this.y = -Math.random() * height;
                this.speed = Math.random() * 3 + 2;
                this.length = Math.floor(Math.random() * 25) + 10;
                this.drops = [];
                this.isImportant = Math.random() < 0.05; // 5% chance of being "important"
                this.baseSpeed = this.speed;
                this.disturbance = 0;
                this.disturbanceX = 0;

                this.initDrops();
            }

            initDrops() {
                for (let i = 0; i < this.length; i++) {
                    const isHead = i === 0;
                    this.drops.push(new Drop(
                        this.x,
                        this.y - i * 20,
                        this.speed,
                        isHead,
                        this.isImportant
                    ));
                }
            }

            update(deltaTime) {
                // Apply disturbance from mouse
                const dx = mouseX - this.x;
                const dy = mouseY - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const influenceRadius = 150;

                if (dist < influenceRadius) {
                    const force = (1 - dist / influenceRadius) * 0.5;
                    this.disturbance = force;
                    this.disturbanceX = dx * force * 0.1;
                    this.speed = this.baseSpeed * (1 + force * 2);
                } else {
                    this.disturbance *= 0.95;
                    this.disturbanceX *= 0.95;
                    this.speed = this.baseSpeed + (this.speed - this.baseSpeed) * 0.95;
                }

                // Update position
                this.y += this.speed;

                // Update drops
                for (let i = 0; i < this.drops.length; i++) {
                    this.drops[i].y = this.y - i * 20;
                    this.drops[i].x = this.x + this.disturbanceX * (1 - i / this.length);
                    this.drops[i].update(deltaTime);
                }

                // Reset if off screen
                if (this.drops[this.drops.length - 1].y > height + 100) {
                    this.y = -Math.random() * 200;
                    this.length = Math.floor(Math.random() * 25) + 10;
                    this.isImportant = Math.random() < 0.05;
                    this.drops = [];
                    this.initDrops();
                }
            }

            draw() {
                for (let i = 0; i < this.drops.length; i++) {
                    const drop = this.drops[i];
                    if (drop.y < -20 || drop.y > height + 20) continue;

                    const fadeRatio = 1 - (i / this.length);
                    let alpha = fadeRatio * 0.9 + 0.1;

                    // Add disturbance glow
                    alpha = Math.min(1, alpha + this.disturbance * 0.5);

                    let color;
                    let fontSize = 18;
                    let glowSize = 0;

                    if (i === 0) {
                        // Head of stream - brightest
                        if (this.isImportant) {
                            color = cyberpunkPink;
                            glowSize = 15;
                        } else if (this.disturbance > 0.1) {
                            color = cyberpunkPink;
                            glowSize = 10 * this.disturbance;
                        } else {
                            color = brightGreen;
                            glowSize = 8;
                        }
                        fontSize = 20;
                    } else if (this.isImportant) {
                        // Important stream - pink tinted
                        const pinkRatio = Math.max(0, 1 - i / 5);
                        if (pinkRatio > 0) {
                            color = this.lerpColor(matrixGreen, cyberpunkPink, pinkRatio * alpha);
                        } else {
                            color = matrixGreen;
                        }
                        glowSize = 5 * fadeRatio;
                    } else {
                        color = matrixGreen;
                        glowSize = 3 * fadeRatio;
                    }

                    // Apply alpha to color
                    ctx.globalAlpha = alpha;
                    ctx.font = `${fontSize}px 'Courier New', monospace`;
                    ctx.textAlign = 'center';

                    // Glow effect
                    if (glowSize > 0) {
                        ctx.shadowColor = color;
                        ctx.shadowBlur = glowSize;
                    } else {
                        ctx.shadowBlur = 0;
                    }

                    ctx.fillStyle = color;
                    ctx.fillText(drop.char, drop.x, drop.y);
                }

                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }

            lerpColor(color1, color2, ratio) {
                const r1 = parseInt(color1.slice(1, 3), 16);
                const g1 = parseInt(color1.slice(3, 5), 16);
                const b1 = parseInt(color1.slice(5, 7), 16);

                const r2 = parseInt(color2.slice(1, 3), 16);
                const g2 = parseInt(color2.slice(3, 5), 16);
                const b2 = parseInt(color2.slice(5, 7), 16);

                const r = Math.round(r1 + (r2 - r1) * ratio);
                const g = Math.round(g1 + (g2 - g1) * ratio);
                const b = Math.round(b1 + (b2 - b1) * ratio);

                return `rgb(${r}, ${g}, ${b})`;
            }
        }

        class Ripple {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = 200;
                this.alpha = 0.8;
                this.speed = 5;
            }

            update() {
                this.radius += this.speed;
                this.alpha = 0.8 * (1 - this.radius / this.maxRadius);
                return this.radius < this.maxRadius;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 42, 109, ${this.alpha})`;
                ctx.lineWidth = 2;
                ctx.stroke();

                // Inner ring
                if (this.radius > 20) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * 0.7, 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(0, 255, 65, ${this.alpha * 0.5})`;
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            // Recalculate columns
            const columnWidth = 25;
            columns = Math.ceil(width / columnWidth);

            // Reinitialize streams
            streams = [];
            for (let i = 0; i < columns; i++) {
                streams.push(new Stream(i * columnWidth + columnWidth / 2));
            }
        }

        function animate(currentTime) {
            requestAnimationFrame(animate);

            const deltaTime = currentTime - lastTime;
            if (deltaTime < frameInterval) return;

            lastTime = currentTime - (deltaTime % frameInterval);

            // Clear with fade effect for trails
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, width, height);

            // Update and draw ripples
            for (let i = ripples.length - 1; i >= 0; i--) {
                if (!ripples[i].update()) {
                    ripples.splice(i, 1);
                } else {
                    ripples[i].draw();
                }
            }

            // Update and draw streams
            for (const stream of streams) {
                stream.update(deltaTime / 16.67);
                stream.draw();
            }

            // Occasional random pink flash on random stream
            if (Math.random() < 0.001) {
                const randomStream = streams[Math.floor(Math.random() * streams.length)];
                randomStream.isImportant = true;
                setTimeout(() => {
                    randomStream.isImportant = false;
                }, 2000);
            }
        }

        // Event listeners
        window.addEventListener('resize', resize);

        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        canvas.addEventListener('mouseleave', () => {
            mouseX = -1000;
            mouseY = -1000;
        });

        canvas.addEventListener('click', (e) => {
            ripples.push(new Ripple(e.clientX, e.clientY));

            // Create burst effect - make nearby streams important briefly
            for (const stream of streams) {
                const dx = e.clientX - stream.x;
                const dy = e.clientY - stream.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < 100) {
                    stream.isImportant = true;
                    stream.speed = stream.baseSpeed * 3;
                    setTimeout(() => {
                        stream.isImportant = false;
                    }, 1000);
                }
            }
        });

        // Touch support
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            mouseX = touch.clientX;
            mouseY = touch.clientY;
        });

        canvas.addEventListener('touchend', () => {
            mouseX = -1000;
            mouseY = -1000;
        });

        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            ripples.push(new Ripple(touch.clientX, touch.clientY));
        });

        // Initialize
        resize();
        requestAnimationFrame(animate);

        // Hide info after 5 seconds
        setTimeout(() => {
            document.getElementById('info').style.transition = 'opacity 2s';
            document.getElementById('info').style.opacity = '0';
        }, 5000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON DNA - Digital Genetics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            overflow: hidden;
            cursor: crosshair;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.4) 100%);
        }

        .title {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #05d9e8;
            font-size: 14px;
            letter-spacing: 8px;
            text-transform: uppercase;
            text-shadow: 0 0 20px #05d9e8, 0 0 40px #05d9e8;
            z-index: 10;
            opacity: 0.8;
        }

        .info {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff2a6d;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.6;
            z-index: 10;
        }

        .mutation-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease-out;
            z-index: 5;
        }

        .mutation-flash.active {
            opacity: 0.15;
        }

        .sequence {
            position: fixed;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            color: #00ff9f;
            font-size: 10px;
            letter-spacing: 2px;
            opacity: 0.4;
            z-index: 10;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
    </style>
</head>
<body>
    <canvas id="dna"></canvas>
    <div class="overlay"></div>
    <div class="title">Digital Genetics</div>
    <div class="info">Click to Mutate</div>
    <div class="mutation-flash" id="flash"></div>
    <div class="sequence" id="sequence">ATCG-GCTA-TACG-CGAT</div>

    <script>
        const canvas = document.getElementById('dna');
        const ctx = canvas.getContext('2d');
        const flash = document.getElementById('flash');
        const sequenceEl = document.getElementById('sequence');

        let width, height;
        let time = 0;
        let mutationLevel = 0;

        // Neon color palettes
        const palettes = [
            ['#ff2a6d', '#05d9e8', '#00ff9f'],  // Original neon
            ['#ff6b35', '#f7c59f', '#efefef'],  // Warm sunset
            ['#7b2cbf', '#e0aaff', '#c77dff'],  // Purple haze
            ['#00f5d4', '#00bbf9', '#9b5de5'],  // Cyber ocean
            ['#fee440', '#f15bb5', '#00f5d4'],  // Candy
            ['#ff006e', '#8338ec', '#3a86ff'],  // Electric dreams
        ];

        let currentPalette = 0;
        let colors = [...palettes[0]];
        let targetColors = [...palettes[0]];

        // DNA structure parameters
        const dna = {
            radius: 120,
            height: 600,
            turns: 3,
            nodesPerStrand: 40,
            basePairWidth: 4,
            nodeSize: 8
        };

        // Particles floating around
        const particles = [];
        const particleCount = 50;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function initParticles() {
            particles.length = 0;
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    z: Math.random() * 200 - 100,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    size: Math.random() * 2 + 1,
                    alpha: Math.random() * 0.5 + 0.2
                });
            }
        }

        function lerpColor(color1, color2, t) {
            const r1 = parseInt(color1.slice(1, 3), 16);
            const g1 = parseInt(color1.slice(3, 5), 16);
            const b1 = parseInt(color1.slice(5, 7), 16);
            const r2 = parseInt(color2.slice(1, 3), 16);
            const g2 = parseInt(color2.slice(3, 5), 16);
            const b2 = parseInt(color2.slice(5, 7), 16);
            const r = Math.round(r1 + (r2 - r1) * t);
            const g = Math.round(g1 + (g2 - g1) * t);
            const b = Math.round(b1 + (b2 - b1) * t);
            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
        }

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function drawGlowLine(x1, y1, x2, y2, color, width, glowSize) {
            ctx.save();
            ctx.lineCap = 'round';

            // Outer glow
            ctx.strokeStyle = hexToRgba(color, 0.1);
            ctx.lineWidth = width + glowSize * 2;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            // Mid glow
            ctx.strokeStyle = hexToRgba(color, 0.3);
            ctx.lineWidth = width + glowSize;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            // Core line
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.shadowColor = color;
            ctx.shadowBlur = glowSize;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            ctx.restore();
        }

        function drawGlowCircle(x, y, radius, color, glowSize) {
            ctx.save();

            // Outer glow
            const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius + glowSize);
            gradient.addColorStop(0, color);
            gradient.addColorStop(0.4, hexToRgba(color, 0.6));
            gradient.addColorStop(0.7, hexToRgba(color, 0.2));
            gradient.addColorStop(1, 'transparent');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(x, y, radius + glowSize, 0, Math.PI * 2);
            ctx.fill();

            // Core
            ctx.fillStyle = color;
            ctx.shadowColor = color;
            ctx.shadowBlur = glowSize;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function project3D(x, y, z) {
            const perspective = 800;
            const scale = perspective / (perspective + z);
            return {
                x: width / 2 + x * scale,
                y: height / 2 + y * scale,
                scale: scale
            };
        }

        function drawDNA() {
            const nodes1 = [];
            const nodes2 = [];
            const basePairs = [];

            const rotationSpeed = 0.0008;
            const rotation = time * rotationSpeed;

            // Calculate all node positions
            for (let i = 0; i < dna.nodesPerStrand; i++) {
                const t = i / (dna.nodesPerStrand - 1);
                const angle = t * Math.PI * 2 * dna.turns + rotation;
                const y = (t - 0.5) * dna.height;

                // Strand 1
                const x1 = Math.cos(angle) * dna.radius;
                const z1 = Math.sin(angle) * dna.radius;

                // Strand 2 (opposite side)
                const x2 = Math.cos(angle + Math.PI) * dna.radius;
                const z2 = Math.sin(angle + Math.PI) * dna.radius;

                // Apply wave distortion
                const wave = Math.sin(t * Math.PI * 4 + time * 0.002) * 15;
                const wobble = Math.sin(t * Math.PI * 6 + time * 0.003) * 5;

                nodes1.push({
                    x: x1 + wobble,
                    y: y + wave,
                    z: z1,
                    angle: angle
                });

                nodes2.push({
                    x: x2 + wobble,
                    y: y + wave,
                    z: z2,
                    angle: angle + Math.PI
                });

                // Base pairs (every 2nd node)
                if (i % 2 === 0) {
                    basePairs.push({
                        node1: nodes1[i],
                        node2: nodes2[i],
                        index: i
                    });
                }
            }

            // Sort everything by z for proper depth rendering
            const allElements = [];

            // Add strand segments
            for (let i = 0; i < nodes1.length - 1; i++) {
                const avgZ1 = (nodes1[i].z + nodes1[i + 1].z) / 2;
                const avgZ2 = (nodes2[i].z + nodes2[i + 1].z) / 2;

                allElements.push({
                    type: 'segment',
                    strand: 1,
                    start: nodes1[i],
                    end: nodes1[i + 1],
                    z: avgZ1
                });

                allElements.push({
                    type: 'segment',
                    strand: 2,
                    start: nodes2[i],
                    end: nodes2[i + 1],
                    z: avgZ2
                });
            }

            // Add base pairs
            basePairs.forEach((pair, idx) => {
                allElements.push({
                    type: 'basePair',
                    pair: pair,
                    z: (pair.node1.z + pair.node2.z) / 2,
                    index: idx
                });
            });

            // Add nodes
            nodes1.forEach((node, i) => {
                allElements.push({ type: 'node', strand: 1, node: node, z: node.z, index: i });
            });
            nodes2.forEach((node, i) => {
                allElements.push({ type: 'node', strand: 2, node: node, z: node.z, index: i });
            });

            // Sort by z (back to front)
            allElements.sort((a, b) => a.z - b.z);

            // Draw all elements
            allElements.forEach(el => {
                if (el.type === 'segment') {
                    const p1 = project3D(el.start.x, el.start.y, el.start.z);
                    const p2 = project3D(el.end.x, el.end.y, el.end.z);
                    const color = el.strand === 1 ? colors[0] : colors[1];
                    const depthFade = (el.z + dna.radius) / (dna.radius * 2);
                    const alpha = 0.3 + depthFade * 0.7;

                    drawGlowLine(
                        p1.x, p1.y,
                        p2.x, p2.y,
                        hexToRgba(color, alpha),
                        3 * p1.scale,
                        15 * p1.scale
                    );
                } else if (el.type === 'basePair') {
                    const p1 = project3D(el.pair.node1.x, el.pair.node1.y, el.pair.node1.z);
                    const p2 = project3D(el.pair.node2.x, el.pair.node2.y, el.pair.node2.z);
                    const depthFade = (el.z + dna.radius) / (dna.radius * 2);
                    const alpha = 0.2 + depthFade * 0.5;

                    // Draw base pair as two connected segments meeting in middle
                    const midX = (p1.x + p2.x) / 2;
                    const midY = (p1.y + p2.y) / 2;
                    const scale = (p1.scale + p2.scale) / 2;

                    // Pulse effect
                    const pulse = 0.7 + Math.sin(time * 0.003 + el.index * 0.5) * 0.3;

                    drawGlowLine(
                        p1.x, p1.y,
                        midX, midY,
                        hexToRgba(colors[2], alpha * pulse),
                        2 * scale,
                        8 * scale
                    );
                    drawGlowLine(
                        midX, midY,
                        p2.x, p2.y,
                        hexToRgba(colors[2], alpha * pulse),
                        2 * scale,
                        8 * scale
                    );
                } else if (el.type === 'node') {
                    const p = project3D(el.node.x, el.node.y, el.node.z);
                    const color = el.strand === 1 ? colors[0] : colors[1];
                    const depthFade = (el.z + dna.radius) / (dna.radius * 2);

                    // Pulsing size
                    const pulse = 1 + Math.sin(time * 0.004 + el.index * 0.3) * 0.2;
                    const size = dna.nodeSize * p.scale * pulse * (0.5 + depthFade * 0.5);

                    drawGlowCircle(p.x, p.y, size, color, 12 * p.scale);
                }
            });
        }

        function drawParticles() {
            particles.forEach(p => {
                // Update position
                p.x += p.vx;
                p.y += p.vy;
                p.z += Math.sin(time * 0.001 + p.x * 0.01) * 0.2;

                // Wrap around
                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height;
                if (p.y > height) p.y = 0;

                // Draw
                const proj = project3D(p.x - width/2, p.y - height/2, p.z);
                const color = colors[Math.floor(Math.abs(p.x + p.y) % 3)];
                const size = p.size * proj.scale;

                ctx.fillStyle = hexToRgba(color, p.alpha * 0.5);
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawScanlines() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.03)';
            for (let y = 0; y < height; y += 4) {
                ctx.fillRect(0, y, width, 2);
            }
        }

        function updateColors() {
            for (let i = 0; i < colors.length; i++) {
                colors[i] = lerpColor(colors[i], targetColors[i], 0.05);
            }
        }

        function mutate() {
            // Flash effect
            flash.classList.add('active');
            setTimeout(() => flash.classList.remove('active'), 100);

            // Change palette
            currentPalette = (currentPalette + 1) % palettes.length;
            targetColors = [...palettes[currentPalette]];

            // Update mutation level
            mutationLevel++;

            // Update sequence display
            const bases = ['A', 'T', 'C', 'G'];
            let sequence = '';
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    sequence += bases[Math.floor(Math.random() * 4)];
                }
                if (i < 3) sequence += '-';
            }
            sequenceEl.textContent = sequence;
            sequenceEl.style.color = targetColors[2];
        }

        function animate(timestamp) {
            time = timestamp;

            // Clear with fade effect
            ctx.fillStyle = 'rgba(10, 10, 15, 0.15)';
            ctx.fillRect(0, 0, width, height);

            updateColors();
            drawParticles();
            drawDNA();
            drawScanlines();

            requestAnimationFrame(animate);
        }

        // Initialize
        resize();
        initParticles();
        window.addEventListener('resize', () => {
            resize();
            initParticles();
        });

        // Click to mutate
        canvas.addEventListener('click', mutate);
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                mutate();
            }
        });

        // Start animation
        requestAnimationFrame(animate);
    </script>
</body>
</html>

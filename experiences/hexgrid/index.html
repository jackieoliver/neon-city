<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Hexgrid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        #info {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #05d9e8;
            font-size: 12px;
            opacity: 0.6;
            text-shadow: 0 0 10px #05d9e8;
            pointer-events: none;
            z-index: 100;
        }

        #fps {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #ff2a6d;
            font-size: 14px;
            opacity: 0.8;
            text-shadow: 0 0 10px #ff2a6d;
            pointer-events: none;
            z-index: 100;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="info">HEXGRID // MOVE CURSOR TO INTERACT</div>
    <div id="fps">60 FPS</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const fpsDisplay = document.getElementById('fps');

        // Neon colors
        const NEON_PINK = '#ff2a6d';
        const NEON_CYAN = '#05d9e8';
        const NEON_MAGENTA = '#d300c5';
        const COLORS = [NEON_PINK, NEON_CYAN, NEON_MAGENTA];

        let width, height;
        let hexagons = [];
        let mouse = { x: -1000, y: -1000 };
        let lastMouse = { x: -1000, y: -1000 };
        let waves = [];
        let time = 0;

        // Hex grid settings
        const HEX_SIZE = 30;
        const HEX_GAP = 4;

        // FPS tracking
        let frameCount = 0;
        let lastFpsTime = performance.now();
        let currentFps = 60;

        class Hexagon {
            constructor(x, y, col, row) {
                this.x = x;
                this.y = y;
                this.col = col;
                this.row = row;
                this.size = HEX_SIZE;
                this.baseColor = { r: 20, g: 20, b: 30 };
                this.currentColor = { ...this.baseColor };
                this.targetColor = { ...this.baseColor };
                this.energy = 0;
                this.targetEnergy = 0;
                this.pulsePhase = Math.random() * Math.PI * 2;
                this.waveEnergy = 0;
                this.patternValue = 0;
            }

            update(deltaTime) {
                // Smooth color transitions
                this.currentColor.r += (this.targetColor.r - this.currentColor.r) * 0.1;
                this.currentColor.g += (this.targetColor.g - this.currentColor.g) * 0.1;
                this.currentColor.b += (this.targetColor.b - this.currentColor.b) * 0.1;

                // Energy decay
                this.energy += (this.targetEnergy - this.energy) * 0.15;
                this.targetEnergy *= 0.95;

                // Wave energy decay
                this.waveEnergy *= 0.92;

                // Pattern value decay
                this.patternValue *= 0.98;
            }

            applyWave(intensity, colorIndex) {
                this.waveEnergy = Math.max(this.waveEnergy, intensity);
                const color = hexToRgb(COLORS[colorIndex % COLORS.length]);
                this.targetColor = {
                    r: Math.min(255, this.baseColor.r + color.r * intensity),
                    g: Math.min(255, this.baseColor.g + color.g * intensity),
                    b: Math.min(255, this.baseColor.b + color.b * intensity)
                };
            }

            applyPattern(value, colorIndex) {
                this.patternValue = Math.max(this.patternValue, value);
                const color = hexToRgb(COLORS[colorIndex % COLORS.length]);
                this.targetColor = {
                    r: Math.min(255, this.currentColor.r + color.r * value * 0.5),
                    g: Math.min(255, this.currentColor.g + color.g * value * 0.5),
                    b: Math.min(255, this.currentColor.b + color.b * value * 0.5)
                };
            }

            draw(ctx) {
                const pulse = Math.sin(time * 2 + this.pulsePhase) * 0.1 + 1;
                const totalEnergy = this.energy + this.waveEnergy + this.patternValue;
                const size = this.size * (1 + totalEnergy * 0.1) * pulse;

                // Draw hexagon
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (Math.PI / 3) * i - Math.PI / 6;
                    const px = this.x + size * Math.cos(angle);
                    const py = this.y + size * Math.sin(angle);
                    if (i === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.closePath();

                // Fill
                const brightness = 0.3 + totalEnergy * 0.7;
                ctx.fillStyle = `rgba(${Math.floor(this.currentColor.r * brightness)}, ${Math.floor(this.currentColor.g * brightness)}, ${Math.floor(this.currentColor.b * brightness)}, 0.8)`;
                ctx.fill();

                // Stroke with glow effect
                if (totalEnergy > 0.1) {
                    const glowIntensity = totalEnergy;
                    ctx.shadowBlur = 15 * glowIntensity;
                    ctx.shadowColor = `rgb(${Math.floor(this.currentColor.r)}, ${Math.floor(this.currentColor.g)}, ${Math.floor(this.currentColor.b)})`;
                }

                ctx.strokeStyle = `rgba(${Math.floor(this.currentColor.r)}, ${Math.floor(this.currentColor.g)}, ${Math.floor(this.currentColor.b)}, ${0.4 + totalEnergy * 0.6})`;
                ctx.lineWidth = 1 + totalEnergy * 2;
                ctx.stroke();

                ctx.shadowBlur = 0;

                // Draw inner hexagon for high energy
                if (totalEnergy > 0.3) {
                    const innerSize = size * 0.5 * totalEnergy;
                    ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const angle = (Math.PI / 3) * i - Math.PI / 6;
                        const px = this.x + innerSize * Math.cos(angle);
                        const py = this.y + innerSize * Math.sin(angle);
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fillStyle = `rgba(${Math.floor(this.currentColor.r)}, ${Math.floor(this.currentColor.g)}, ${Math.floor(this.currentColor.b)}, ${totalEnergy * 0.5})`;
                    ctx.fill();
                }
            }

            contains(px, py) {
                const dx = px - this.x;
                const dy = py - this.y;
                return Math.sqrt(dx * dx + dy * dy) < this.size;
            }
        }

        class Wave {
            constructor(x, y, colorIndex) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.maxRadius = Math.max(width, height);
                this.speed = 400;
                this.colorIndex = colorIndex;
                this.active = true;
            }

            update(deltaTime) {
                this.radius += this.speed * deltaTime;
                if (this.radius > this.maxRadius) {
                    this.active = false;
                }
            }

            getIntensity(x, y) {
                const dist = Math.sqrt((x - this.x) ** 2 + (y - this.y) ** 2);
                const waveFront = Math.abs(dist - this.radius);
                const waveWidth = 80;

                if (waveFront < waveWidth) {
                    const falloff = 1 - this.radius / this.maxRadius;
                    return (1 - waveFront / waveWidth) * falloff;
                }
                return 0;
            }
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 0, b: 0 };
        }

        function createHexGrid() {
            hexagons = [];
            const hexWidth = HEX_SIZE * 2;
            const hexHeight = Math.sqrt(3) * HEX_SIZE;
            const cols = Math.ceil(width / (hexWidth * 0.75)) + 2;
            const rows = Math.ceil(height / hexHeight) + 2;

            for (let row = -1; row < rows; row++) {
                for (let col = -1; col < cols; col++) {
                    const x = col * (hexWidth * 0.75);
                    const y = row * hexHeight + (col % 2 === 0 ? 0 : hexHeight / 2);
                    hexagons.push(new Hexagon(x, y, col, row));
                }
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            createHexGrid();
        }

        function handleMouseMove(e) {
            lastMouse.x = mouse.x;
            lastMouse.y = mouse.y;
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        }

        function handleClick(e) {
            const colorIndex = Math.floor(Math.random() * COLORS.length);
            waves.push(new Wave(e.clientX, e.clientY, colorIndex));
        }

        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            mouse.x = touch.clientX;
            mouse.y = touch.clientY;
        }

        function handleTouchStart(e) {
            handleTouch(e);
            const touch = e.touches[0];
            const colorIndex = Math.floor(Math.random() * COLORS.length);
            waves.push(new Wave(touch.clientX, touch.clientY, colorIndex));
        }

        // Procedural pattern functions
        function getNoiseValue(x, y, scale, timeOffset) {
            const nx = x * scale + timeOffset;
            const ny = y * scale + timeOffset * 0.7;
            return (Math.sin(nx) * Math.cos(ny) + Math.sin(nx * 1.5 + ny) * 0.5) * 0.5 + 0.5;
        }

        function getSpiral(x, y, cx, cy, scale) {
            const dx = x - cx;
            const dy = y - cy;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const angle = Math.atan2(dy, dx);
            return Math.sin(dist * scale - angle * 3 + time * 2) * 0.5 + 0.5;
        }

        function getRadialWave(x, y, cx, cy) {
            const dx = x - cx;
            const dy = y - cy;
            const dist = Math.sqrt(dx * dx + dy * dy);
            return Math.sin(dist * 0.02 - time * 3) * 0.5 + 0.5;
        }

        let lastTime = performance.now();

        function animate() {
            const currentTime = performance.now();
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;
            time += deltaTime;

            // FPS calculation
            frameCount++;
            if (currentTime - lastFpsTime >= 1000) {
                currentFps = frameCount;
                fpsDisplay.textContent = `${currentFps} FPS`;
                frameCount = 0;
                lastFpsTime = currentTime;
            }

            // Clear with trail effect
            ctx.fillStyle = 'rgba(10, 10, 15, 0.3)';
            ctx.fillRect(0, 0, width, height);

            // Update waves
            waves = waves.filter(wave => wave.active);
            waves.forEach(wave => wave.update(deltaTime));

            // Create automatic waves occasionally
            if (Math.random() < 0.005) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const colorIndex = Math.floor(Math.random() * COLORS.length);
                waves.push(new Wave(x, y, colorIndex));
            }

            // Update hexagons
            hexagons.forEach(hex => {
                // Reset target color
                hex.targetColor = { ...hex.baseColor };

                // Mouse interaction
                const dx = mouse.x - hex.x;
                const dy = mouse.y - hex.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const interactionRadius = 150;

                if (dist < interactionRadius) {
                    const intensity = 1 - dist / interactionRadius;
                    hex.targetEnergy = Math.max(hex.targetEnergy, intensity);

                    const colorIndex = Math.floor((hex.col + hex.row) % COLORS.length);
                    const color = hexToRgb(COLORS[colorIndex]);
                    hex.targetColor = {
                        r: Math.min(255, hex.baseColor.r + color.r * intensity),
                        g: Math.min(255, hex.baseColor.g + color.g * intensity),
                        b: Math.min(255, hex.baseColor.b + color.b * intensity)
                    };
                }

                // Wave interaction
                waves.forEach(wave => {
                    const intensity = wave.getIntensity(hex.x, hex.y);
                    if (intensity > 0.01) {
                        hex.applyWave(intensity, wave.colorIndex);
                    }
                });

                // Procedural patterns
                const noiseVal = getNoiseValue(hex.x, hex.y, 0.005, time * 0.5);
                const spiralVal = getSpiral(hex.x, hex.y, width / 2, height / 2, 0.01);
                const radialVal = getRadialWave(hex.x, hex.y, width / 2, height / 2);

                // Combine patterns
                const patternVal = (noiseVal * 0.3 + spiralVal * 0.3 + radialVal * 0.4);
                if (patternVal > 0.6) {
                    const patternColorIndex = Math.floor(time + hex.col * 0.1) % COLORS.length;
                    hex.applyPattern((patternVal - 0.6) * 2.5, patternColorIndex);
                }

                hex.update(deltaTime);
            });

            // Draw hexagons
            hexagons.forEach(hex => hex.draw(ctx));

            // Draw connecting lines between highly energized hexagons
            ctx.lineCap = 'round';
            hexagons.forEach((hex, i) => {
                if (hex.energy + hex.waveEnergy > 0.3) {
                    hexagons.slice(i + 1).forEach(other => {
                        if (other.energy + other.waveEnergy > 0.3) {
                            const dist = Math.sqrt((hex.x - other.x) ** 2 + (hex.y - other.y) ** 2);
                            if (dist < HEX_SIZE * 3) {
                                const intensity = Math.min(hex.energy + hex.waveEnergy, other.energy + other.waveEnergy) * 0.5;
                                ctx.beginPath();
                                ctx.moveTo(hex.x, hex.y);
                                ctx.lineTo(other.x, other.y);
                                ctx.strokeStyle = `rgba(${hex.currentColor.r}, ${hex.currentColor.g}, ${hex.currentColor.b}, ${intensity})`;
                                ctx.lineWidth = intensity * 2;
                                ctx.stroke();
                            }
                        }
                    });
                }
            });

            requestAnimationFrame(animate);
        }

        // Initialize
        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('click', handleClick);
        window.addEventListener('touchmove', handleTouch, { passive: false });
        window.addEventListener('touchstart', handleTouchStart, { passive: false });

        resize();
        animate();
    </script>
</body>
</html>

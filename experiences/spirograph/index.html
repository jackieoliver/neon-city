<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Spirograph</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            overflow: hidden;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
        }

        #info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #05d9e8;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            text-shadow: 0 0 10px #05d9e8;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        #info.hidden {
            opacity: 0;
        }

        .glow-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.3) 100%);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="glow-overlay"></div>
    <div id="info">Click anywhere to generate new pattern</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const info = document.getElementById('info');

        // Neon colors
        const colors = [
            '#ff2a6d', // Hot pink
            '#05d9e8', // Cyan
            '#d300c5', // Magenta
            '#ff6b35', // Orange
            '#01ff89'  // Green
        ];

        let width, height, centerX, centerY;
        let spirographs = [];
        let time = 0;
        let fadeStarted = false;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        // Spirograph/Harmonograph pattern generator
        class Spirograph {
            constructor(colorIndex) {
                this.color = colors[colorIndex % colors.length];
                this.points = [];
                this.currentT = 0;
                this.maxT = Math.PI * 2 * (20 + Math.random() * 40);
                this.speed = 0.02 + Math.random() * 0.03;
                this.complete = false;

                // Spirograph parameters - creates epitrochoid/hypotrochoid patterns
                // R = radius of fixed circle
                // r = radius of rolling circle
                // d = distance of pen from center of rolling circle
                const scale = Math.min(width, height) * 0.35;

                // Use ratios that create interesting patterns
                const ratios = [
                    { R: 5, r: 3, d: 5 },
                    { R: 7, r: 2, d: 6 },
                    { R: 8, r: 5, d: 7 },
                    { R: 11, r: 7, d: 9 },
                    { R: 13, r: 8, d: 11 },
                    { R: 5, r: 2, d: 3 },
                    { R: 9, r: 4, d: 7 },
                    { R: 7, r: 3, d: 5 },
                    { R: 10, r: 7, d: 8 },
                    { R: 6, r: 5, d: 4 }
                ];

                const ratio = ratios[Math.floor(Math.random() * ratios.length)];
                this.R = ratio.R * scale / 15;
                this.r = ratio.r * scale / 15;
                this.d = ratio.d * scale / 15;

                // Direction: hypotrochoid (inside) or epitrochoid (outside)
                this.inside = Math.random() > 0.5;

                // Additional harmonograph-style damping and phase
                this.damping = 0.9995 + Math.random() * 0.0004;
                this.phaseX = Math.random() * Math.PI * 2;
                this.phaseY = Math.random() * Math.PI * 2;

                // Rotation offset
                this.rotation = Math.random() * Math.PI * 2;

                // Line properties
                this.lineWidth = 1 + Math.random() * 1.5;
                this.glowIntensity = 15 + Math.random() * 20;
            }

            getPoint(t) {
                let x, y;
                const dampFactor = Math.pow(this.damping, t * 10);

                if (this.inside) {
                    // Hypotrochoid: rolling circle inside fixed circle
                    const diff = this.R - this.r;
                    x = diff * Math.cos(t + this.phaseX) +
                        this.d * Math.cos((diff / this.r) * t + this.phaseX);
                    y = diff * Math.sin(t + this.phaseY) -
                        this.d * Math.sin((diff / this.r) * t + this.phaseY);
                } else {
                    // Epitrochoid: rolling circle outside fixed circle
                    const sum = this.R + this.r;
                    x = sum * Math.cos(t + this.phaseX) -
                        this.d * Math.cos((sum / this.r) * t + this.phaseX);
                    y = sum * Math.sin(t + this.phaseY) -
                        this.d * Math.sin((sum / this.r) * t + this.phaseY);
                }

                // Apply damping for harmonograph effect
                x *= dampFactor;
                y *= dampFactor;

                // Apply rotation
                const cos = Math.cos(this.rotation);
                const sin = Math.sin(this.rotation);
                const rx = x * cos - y * sin;
                const ry = x * sin + y * cos;

                return { x: centerX + rx, y: centerY + ry };
            }

            update() {
                if (this.complete) return;

                // Add multiple points per frame for smoother curves
                const pointsPerFrame = 5;
                for (let i = 0; i < pointsPerFrame; i++) {
                    if (this.currentT >= this.maxT) {
                        this.complete = true;
                        break;
                    }

                    this.points.push(this.getPoint(this.currentT));
                    this.currentT += this.speed;
                }
            }

            draw() {
                if (this.points.length < 2) return;

                // Draw with glow effect
                ctx.save();
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.lineWidth;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // Outer glow
                ctx.shadowColor = this.color;
                ctx.shadowBlur = this.glowIntensity;

                ctx.beginPath();
                ctx.moveTo(this.points[0].x, this.points[0].y);

                for (let i = 1; i < this.points.length; i++) {
                    ctx.lineTo(this.points[i].x, this.points[i].y);
                }

                ctx.stroke();

                // Inner bright core
                ctx.shadowBlur = this.glowIntensity / 3;
                ctx.globalAlpha = 0.8;
                ctx.lineWidth = this.lineWidth * 0.5;
                ctx.stroke();

                ctx.restore();
            }
        }

        function initSpirographs() {
            spirographs = [];

            // Create 3-4 layered spirographs
            const count = 3 + Math.floor(Math.random() * 2);
            const shuffledColors = [...Array(colors.length).keys()].sort(() => Math.random() - 0.5);

            for (let i = 0; i < count; i++) {
                spirographs.push(new Spirograph(shuffledColors[i]));
            }

            // Clear canvas with fade effect
            ctx.fillStyle = 'rgba(10, 10, 15, 1)';
            ctx.fillRect(0, 0, width, height);
        }

        function animate() {
            // Subtle fade for trail effect
            ctx.fillStyle = 'rgba(10, 10, 15, 0.01)';
            ctx.fillRect(0, 0, width, height);

            // Update and draw all spirographs
            let allComplete = true;
            for (const spiro of spirographs) {
                spiro.update();
                spiro.draw();
                if (!spiro.complete) allComplete = false;
            }

            // Hide info after first click
            if (!fadeStarted && spirographs.length > 0) {
                setTimeout(() => {
                    info.classList.add('hidden');
                }, 3000);
                fadeStarted = true;
            }

            time++;
            requestAnimationFrame(animate);
        }

        // Event listeners
        window.addEventListener('resize', () => {
            resize();
            initSpirographs();
        });

        canvas.addEventListener('click', () => {
            initSpirographs();
        });

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            initSpirographs();
        });

        // Initialize
        resize();
        initSpirographs();
        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEON PARTICLES</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d0221;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .ui-overlay {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 100;
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .ui-overlay:hover {
            opacity: 1;
        }

        .mode-btn {
            background: rgba(13, 2, 33, 0.8);
            border: 1px solid #05d9e8;
            color: #05d9e8;
            padding: 8px 16px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }

        .mode-btn:hover {
            background: rgba(5, 217, 232, 0.2);
            box-shadow: 0 0 20px rgba(5, 217, 232, 0.5);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #ff2a6d, #05d9e8);
            border-color: #ff2a6d;
            color: #0d0221;
            box-shadow: 0 0 30px rgba(255, 42, 109, 0.6);
        }

        .title {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #05d9e8;
            font-size: 10px;
            letter-spacing: 8px;
            text-transform: uppercase;
            opacity: 0.4;
            z-index: 100;
            pointer-events: none;
        }

        .particle-count {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #ff2a6d;
            font-size: 10px;
            opacity: 0.5;
            z-index: 100;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="title">NEON PARTICLES</div>
    <div class="particle-count" id="count"></div>

    <div class="ui-overlay">
        <button class="mode-btn active" data-mode="attract">ATTRACT</button>
        <button class="mode-btn" data-mode="repel">REPEL</button>
        <button class="mode-btn" data-mode="flock">FLOCK</button>
        <button class="mode-btn" data-mode="explode">EXPLODE</button>
        <button class="mode-btn" data-mode="vortex">VORTEX</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const countEl = document.getElementById('count');

        // Embedded mode detection
        const isEmbedded = window.self !== window.top;
        let isPaused = false;
        let animationId = null;

        // Listen for pause/resume from parent
        window.addEventListener('message', (e) => {
            if (e.data === 'neon-pause') {
                isPaused = true;
            } else if (e.data === 'neon-resume') {
                isPaused = false;
                if (!animationId) animate();
            }
        });

        // Visibility API
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) isPaused = true;
        });

        // Configuration - REDUCED for embedded mode
        const CONFIG = {
            particleCount: isEmbedded ? 300 : 2000,
            maxSpeed: isEmbedded ? 3 : 4,
            trailLength: isEmbedded ? 0.3 : 0.15,
            glowIntensity: isEmbedded ? 0.4 : 0.8,
            connectionDistance: isEmbedded ? 0 : 80, // Disable connections in embedded
            mouseRadius: 200,
            friction: 0.98
        };

        // Colors
        const COLORS = {
            bg: '#0d0221',
            pink: '#ff2a6d',
            cyan: '#05d9e8',
            purple: '#9d4edd',
            violet: '#7b2cbf'
        };

        // State
        let width, height;
        let mouse = { x: null, y: null, pressed: false };
        let mode = 'attract';
        let particles = [];
        let time = 0;

        // Resize handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        // Particle class
        class Particle {
            constructor(x, y) {
                this.x = x || Math.random() * width;
                this.y = y || Math.random() * height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.size = Math.random() * 2 + 1;
                this.baseSize = this.size;
                this.color = this.getColor();
                this.history = [];
                this.maxHistory = 8;
                this.life = 1;
                this.angle = Math.random() * Math.PI * 2;
            }

            getColor() {
                const colors = [COLORS.pink, COLORS.cyan, COLORS.purple, COLORS.violet];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                // Store history for trails
                this.history.push({ x: this.x, y: this.y });
                if (this.history.length > this.maxHistory) {
                    this.history.shift();
                }

                // Mouse interaction
                if (mouse.x !== null && mouse.y !== null) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < CONFIG.mouseRadius) {
                        const force = (CONFIG.mouseRadius - dist) / CONFIG.mouseRadius;
                        const angle = Math.atan2(dy, dx);

                        switch (mode) {
                            case 'attract':
                                this.vx += Math.cos(angle) * force * 0.5;
                                this.vy += Math.sin(angle) * force * 0.5;
                                break;

                            case 'repel':
                                this.vx -= Math.cos(angle) * force * 0.8;
                                this.vy -= Math.sin(angle) * force * 0.8;
                                break;

                            case 'flock':
                                // Cohesion + separation
                                if (dist > 50) {
                                    this.vx += Math.cos(angle) * force * 0.2;
                                    this.vy += Math.sin(angle) * force * 0.2;
                                } else {
                                    this.vx -= Math.cos(angle) * force * 0.3;
                                    this.vy -= Math.sin(angle) * force * 0.3;
                                }
                                // Alignment - circular motion
                                this.vx += Math.cos(this.angle) * 0.1;
                                this.vy += Math.sin(this.angle) * 0.1;
                                this.angle += 0.02;
                                break;

                            case 'explode':
                                if (mouse.pressed) {
                                    this.vx -= Math.cos(angle) * force * 2;
                                    this.vy -= Math.sin(angle) * force * 2;
                                    this.size = this.baseSize * (1 + force * 2);
                                }
                                break;

                            case 'vortex':
                                const perpAngle = angle + Math.PI / 2;
                                this.vx += Math.cos(perpAngle) * force * 0.5;
                                this.vy += Math.sin(perpAngle) * force * 0.5;
                                // Pull towards center
                                this.vx += Math.cos(angle) * force * 0.1;
                                this.vy += Math.sin(angle) * force * 0.1;
                                break;
                        }
                    }
                }

                // Apply friction
                this.vx *= CONFIG.friction;
                this.vy *= CONFIG.friction;

                // Limit speed
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > CONFIG.maxSpeed) {
                    this.vx = (this.vx / speed) * CONFIG.maxSpeed;
                    this.vy = (this.vy / speed) * CONFIG.maxSpeed;
                }

                // Update position
                this.x += this.vx;
                this.y += this.vy;

                // Wrap around edges
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;

                // Size breathing
                this.size = this.baseSize + Math.sin(time * 0.05 + this.x * 0.01) * 0.5;
            }

            draw() {
                // Draw trail
                if (this.history.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(this.history[0].x, this.history[0].y);

                    for (let i = 1; i < this.history.length; i++) {
                        ctx.lineTo(this.history[i].x, this.history[i].y);
                    }
                    ctx.lineTo(this.x, this.y);

                    const gradient = ctx.createLinearGradient(
                        this.history[0].x, this.history[0].y,
                        this.x, this.y
                    );
                    gradient.addColorStop(0, 'transparent');
                    gradient.addColorStop(1, this.color);

                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = this.size * 0.5;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }

                // Draw particle with glow
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);

                // Outer glow
                const glowGradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.size * 4
                );
                glowGradient.addColorStop(0, this.color);
                glowGradient.addColorStop(0.3, this.color + '80');
                glowGradient.addColorStop(1, 'transparent');

                ctx.fillStyle = glowGradient;
                ctx.fill();

                // Core
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
            }
        }

        // Initialize particles
        function initParticles() {
            particles = [];
            for (let i = 0; i < CONFIG.particleCount; i++) {
                particles.push(new Particle());
            }
        }

        // Draw connections between nearby particles
        function drawConnections() {
            const maxDist = CONFIG.connectionDistance;

            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxDist) {
                        const opacity = (1 - dist / maxDist) * 0.2;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);

                        const gradient = ctx.createLinearGradient(
                            particles[i].x, particles[i].y,
                            particles[j].x, particles[j].y
                        );
                        gradient.addColorStop(0, particles[i].color + Math.floor(opacity * 255).toString(16).padStart(2, '0'));
                        gradient.addColorStop(1, particles[j].color + Math.floor(opacity * 255).toString(16).padStart(2, '0'));

                        ctx.strokeStyle = gradient;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
        }

        // Draw mouse influence area
        function drawMouseInfluence() {
            if (mouse.x === null || mouse.y === null) return;

            const gradient = ctx.createRadialGradient(
                mouse.x, mouse.y, 0,
                mouse.x, mouse.y, CONFIG.mouseRadius
            );

            const color = mode === 'attract' || mode === 'flock' || mode === 'vortex' ? COLORS.cyan : COLORS.pink;

            gradient.addColorStop(0, color + '20');
            gradient.addColorStop(0.5, color + '10');
            gradient.addColorStop(1, 'transparent');

            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, CONFIG.mouseRadius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();

            // Pulsing ring
            const pulseRadius = CONFIG.mouseRadius * (0.8 + Math.sin(time * 0.1) * 0.2);
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, pulseRadius, 0, Math.PI * 2);
            ctx.strokeStyle = color + '40';
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // Spawn explosion particles
        function spawnExplosion(x, y, count = 50) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i;
                const speed = 5 + Math.random() * 5;
                const particle = new Particle(x, y);
                particle.vx = Math.cos(angle) * speed;
                particle.vy = Math.sin(angle) * speed;
                particle.size = Math.random() * 3 + 2;
                particle.baseSize = particle.size;
                particles.push(particle);
            }

            // Remove oldest particles to maintain count
            while (particles.length > CONFIG.particleCount + 200) {
                particles.shift();
            }
        }

        // Frame rate limiting for embedded mode
        let lastFrameTime = 0;
        const targetFPS = isEmbedded ? 30 : 60;
        const frameInterval = 1000 / targetFPS;

        // Main animation loop
        function animate(timestamp) {
            // Skip if paused
            if (isPaused) {
                animationId = null;
                return;
            }

            // Frame rate limiting
            if (timestamp - lastFrameTime < frameInterval) {
                animationId = requestAnimationFrame(animate);
                return;
            }
            lastFrameTime = timestamp;

            // Clear with trail effect
            ctx.fillStyle = COLORS.bg + Math.floor(CONFIG.trailLength * 255).toString(16).padStart(2, '0');
            ctx.fillRect(0, 0, width, height);

            // Enable additive blending for glow
            ctx.globalCompositeOperation = 'lighter';

            // Draw connections (only when NOT embedded and few particles)
            if (!isEmbedded && particles.length < 500 && CONFIG.connectionDistance > 0) {
                drawConnections();
            }

            // Update and draw particles
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            // Draw mouse influence
            drawMouseInfluence();

            // Reset composite operation
            ctx.globalCompositeOperation = 'source-over';

            // Update counter
            countEl.textContent = particles.length + ' PARTICLES';

            time++;
            animationId = requestAnimationFrame(animate);
        }

        // Event listeners
        function handlePointer(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            mouse.x = clientX - rect.left;
            mouse.y = clientY - rect.top;
        }

        canvas.addEventListener('mousemove', handlePointer);
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handlePointer(e);
        }, { passive: false });

        canvas.addEventListener('mousedown', (e) => {
            mouse.pressed = true;
            if (mode === 'explode') {
                spawnExplosion(mouse.x, mouse.y, 80);
            }
        });

        canvas.addEventListener('mouseup', () => mouse.pressed = false);

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handlePointer(e);
            mouse.pressed = true;
            if (mode === 'explode') {
                spawnExplosion(mouse.x, mouse.y, 80);
            }
        }, { passive: false });

        canvas.addEventListener('touchend', () => mouse.pressed = false);

        canvas.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        // Double click/tap for burst
        canvas.addEventListener('dblclick', (e) => {
            const rect = canvas.getBoundingClientRect();
            spawnExplosion(e.clientX - rect.left, e.clientY - rect.top, 100);
        });

        // Mode buttons
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                mode = btn.dataset.mode;
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            const keys = { '1': 'attract', '2': 'repel', '3': 'flock', '4': 'explode', '5': 'vortex' };
            if (keys[e.key]) {
                mode = keys[e.key];
                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.mode === mode);
                });
            }

            // Space for random burst
            if (e.key === ' ') {
                spawnExplosion(Math.random() * width, Math.random() * height, 100);
            }
        });

        // Window resize
        window.addEventListener('resize', resize);

        // Initialize
        resize();
        initParticles();
        animate();

        // Add ambient particle drift
        setInterval(() => {
            particles.forEach(p => {
                p.vx += (Math.random() - 0.5) * 0.1;
                p.vy += (Math.random() - 0.5) * 0.1;
            });
        }, 100);
    </script>
</body>
</html>

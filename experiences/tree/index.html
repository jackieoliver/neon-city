<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Fractal Forest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
        }

        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: #05d9e8;
            font-size: 14px;
            text-shadow: 0 0 10px #05d9e8;
            pointer-events: none;
        }

        #controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            display: flex;
            gap: 10px;
        }

        .btn {
            background: transparent;
            border: 1px solid #ff2a6d;
            color: #ff2a6d;
            padding: 10px 20px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #ff2a6d;
            color: #0a0a0f;
            box-shadow: 0 0 20px #ff2a6d;
        }

        .btn.active {
            background: #ff2a6d;
            color: #0a0a0f;
        }

        #hint {
            position: fixed;
            bottom: 70px;
            left: 20px;
            color: #00ff9f;
            font-size: 12px;
            text-shadow: 0 0 10px #00ff9f;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="ui">
        <div>TREES: <span id="treeCount">0</span></div>
        <div>BRANCHES: <span id="branchCount">0</span></div>
    </div>

    <div id="hint">CLICK ANYWHERE TO PLANT A TREE</div>

    <div id="controls">
        <button class="btn active" data-type="0">CLASSIC</button>
        <button class="btn" data-type="1">WEEPING</button>
        <button class="btn" data-type="2">PINE</button>
        <button class="btn" data-type="3">SAKURA</button>
        <button class="btn" data-type="4">ALIEN</button>
        <button class="btn" id="clearBtn">CLEAR</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const trees = [];
        let currentTreeType = 0;
        let time = 0;
        let windPhase = 0;
        let branchCount = 0;

        const NEON_COLORS = ['#ff2a6d', '#05d9e8', '#00ff9f', '#d400ff', '#ff9500'];

        const TREE_TYPES = {
            0: { name: 'classic', angle: Math.PI / 6, shrink: 0.7, minBranches: 2, maxBranches: 3 },
            1: { name: 'weeping', angle: Math.PI / 4, shrink: 0.75, minBranches: 2, maxBranches: 4, droop: true },
            2: { name: 'pine', angle: Math.PI / 8, shrink: 0.65, minBranches: 3, maxBranches: 5 },
            3: { name: 'sakura', angle: Math.PI / 5, shrink: 0.72, minBranches: 2, maxBranches: 3, blossoms: true },
            4: { name: 'alien', angle: Math.PI / 3, shrink: 0.68, minBranches: 3, maxBranches: 6, spiral: true }
        };

        class Branch {
            constructor(startX, startY, length, angle, depth, tree, parent = null) {
                this.startX = startX;
                this.startY = startY;
                this.length = length;
                this.angle = angle;
                this.depth = depth;
                this.tree = tree;
                this.parent = parent;
                this.children = [];

                this.grown = 0;
                this.growSpeed = 0.02 + Math.random() * 0.02;
                this.baseAngle = angle;
                this.windOffset = Math.random() * Math.PI * 2;
                this.windSensitivity = (depth / tree.maxDepth) * 0.15;

                this.thickness = Math.max(1, (tree.maxDepth - depth + 1) * 2);
                this.color = tree.colors[Math.min(depth, tree.colors.length - 1)];

                this.blossoms = [];
                if (tree.type.blossoms && depth >= tree.maxDepth - 1) {
                    const numBlossoms = Math.floor(Math.random() * 3) + 1;
                    for (let i = 0; i < numBlossoms; i++) {
                        this.blossoms.push({
                            offset: 0.5 + Math.random() * 0.5,
                            size: 2 + Math.random() * 3,
                            pulse: Math.random() * Math.PI * 2
                        });
                    }
                }
            }

            get endX() {
                return this.startX + Math.sin(this.angle) * this.length * this.grown;
            }

            get endY() {
                return this.startY - Math.cos(this.angle) * this.length * this.grown;
            }

            update(deltaTime, windStrength) {
                if (this.grown < 1) {
                    this.grown = Math.min(1, this.grown + this.growSpeed);

                    if (this.grown >= 1 && this.depth < this.tree.maxDepth) {
                        this.createChildren();
                    }
                }

                const windEffect = Math.sin(windPhase + this.windOffset) * windStrength * this.windSensitivity;
                let droopEffect = 0;
                if (this.tree.type.droop) {
                    droopEffect = (this.depth / this.tree.maxDepth) * 0.3;
                }

                this.angle = this.baseAngle + windEffect + droopEffect;

                if (this.parent) {
                    this.startX = this.parent.endX;
                    this.startY = this.parent.endY;
                }

                this.children.forEach(child => child.update(deltaTime, windStrength));
            }

            createChildren() {
                const type = this.tree.type;
                const numBranches = Math.floor(Math.random() * (type.maxBranches - type.minBranches + 1)) + type.minBranches;

                const angleSpread = type.angle * 2;
                const baseChildAngle = this.angle;

                for (let i = 0; i < numBranches; i++) {
                    let childAngle;
                    if (type.spiral) {
                        childAngle = baseChildAngle + (i / numBranches) * Math.PI * 2 - Math.PI;
                    } else {
                        const t = numBranches > 1 ? i / (numBranches - 1) : 0.5;
                        childAngle = baseChildAngle - angleSpread / 2 + t * angleSpread;
                        childAngle += (Math.random() - 0.5) * type.angle * 0.5;
                    }

                    const childLength = this.length * type.shrink * (0.8 + Math.random() * 0.4);

                    const child = new Branch(
                        this.endX, this.endY,
                        childLength, childAngle,
                        this.depth + 1, this.tree, this
                    );
                    this.children.push(child);
                    branchCount++;
                }
            }

            draw(ctx) {
                if (this.grown <= 0) return;

                const gradient = ctx.createLinearGradient(
                    this.startX, this.startY,
                    this.endX, this.endY
                );
                gradient.addColorStop(0, this.color);
                gradient.addColorStop(1, this.color + '88');

                ctx.strokeStyle = gradient;
                ctx.lineWidth = this.thickness * this.grown;
                ctx.lineCap = 'round';
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10 + this.thickness * 2;

                ctx.beginPath();
                ctx.moveTo(this.startX, this.startY);
                ctx.lineTo(this.endX, this.endY);
                ctx.stroke();

                if (this.blossoms.length > 0 && this.grown > 0.5) {
                    this.blossoms.forEach(blossom => {
                        const bx = this.startX + (this.endX - this.startX) * blossom.offset;
                        const by = this.startY + (this.endY - this.startY) * blossom.offset;
                        const pulse = Math.sin(time * 3 + blossom.pulse) * 0.3 + 1;
                        const size = blossom.size * pulse * this.grown;

                        ctx.beginPath();
                        ctx.arc(bx, by, size, 0, Math.PI * 2);
                        ctx.fillStyle = '#ff2a6d';
                        ctx.shadowColor = '#ff2a6d';
                        ctx.shadowBlur = 15;
                        ctx.fill();
                    });
                }

                this.children.forEach(child => child.draw(ctx));
            }
        }

        class Tree {
            constructor(x, y, typeIndex) {
                this.x = x;
                this.y = y;
                this.type = TREE_TYPES[typeIndex];
                this.maxDepth = 8 + Math.floor(Math.random() * 3);

                const colorStart = Math.floor(Math.random() * NEON_COLORS.length);
                this.colors = [];
                for (let i = 0; i <= this.maxDepth; i++) {
                    this.colors.push(NEON_COLORS[(colorStart + Math.floor(i / 2)) % NEON_COLORS.length]);
                }

                const initialLength = 80 + Math.random() * 60;
                this.trunk = new Branch(x, y, initialLength, 0, 0, this);
                branchCount++;
            }

            update(deltaTime, windStrength) {
                this.trunk.update(deltaTime, windStrength);
            }

            draw(ctx) {
                this.trunk.draw(ctx);
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function createTree(x, y) {
            trees.push(new Tree(x, y, currentTreeType));
            document.getElementById('treeCount').textContent = trees.length;
        }

        function drawGround() {
            const groundY = height - 50;

            const gradient = ctx.createLinearGradient(0, groundY - 20, 0, height);
            gradient.addColorStop(0, 'transparent');
            gradient.addColorStop(0.3, '#0a0a0f');
            gradient.addColorStop(1, '#0a0a0f');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, groundY - 20, width, height - groundY + 20);

            ctx.strokeStyle = '#05d9e844';
            ctx.lineWidth = 1;
            ctx.shadowColor = '#05d9e8';
            ctx.shadowBlur = 5;

            ctx.beginPath();
            ctx.moveTo(0, groundY);
            for (let x = 0; x <= width; x += 5) {
                const wave = Math.sin(x * 0.02 + time) * 3;
                ctx.lineTo(x, groundY + wave);
            }
            ctx.stroke();
        }

        function drawStars() {
            ctx.shadowBlur = 0;
            for (let i = 0; i < 100; i++) {
                const x = (i * 137.5) % width;
                const y = (i * 97.3) % (height * 0.6);
                const twinkle = Math.sin(time * 2 + i) * 0.5 + 0.5;
                const size = 0.5 + twinkle;

                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${0.3 + twinkle * 0.4})`;
                ctx.fill();
            }
        }

        let lastTime = 0;
        function animate(currentTime) {
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;
            time = currentTime / 1000;

            windPhase += deltaTime * 0.5;
            const windStrength = Math.sin(time * 0.3) * 0.5 + 0.7;

            ctx.fillStyle = 'rgba(10, 10, 15, 0.1)';
            ctx.fillRect(0, 0, width, height);

            drawStars();

            trees.forEach(tree => {
                tree.update(deltaTime, windStrength);
                tree.draw(ctx);
            });

            drawGround();

            document.getElementById('branchCount').textContent = branchCount;

            requestAnimationFrame(animate);
        }

        function init() {
            resize();
            window.addEventListener('resize', resize);

            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                if (y > height - 100) {
                    createTree(x, height - 50);
                } else {
                    createTree(x, y);
                }
            });

            document.querySelectorAll('.btn[data-type]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.btn[data-type]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentTreeType = parseInt(btn.dataset.type);
                });
            });

            document.getElementById('clearBtn').addEventListener('click', () => {
                trees.length = 0;
                branchCount = 0;
                document.getElementById('treeCount').textContent = '0';
                ctx.fillStyle = '#0a0a0f';
                ctx.fillRect(0, 0, width, height);
            });

            createTree(width * 0.3, height - 50);
            createTree(width * 0.5, height - 50);
            createTree(width * 0.7, height - 50);

            requestAnimationFrame(animate);
        }

        init();
    </script>
</body>
</html>

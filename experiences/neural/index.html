<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Network Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        .ui-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: #05d9e8;
            text-shadow: 0 0 10px #05d9e8;
            pointer-events: none;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff2a6d, #05d9e8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 12px;
            opacity: 0.7;
            letter-spacing: 2px;
        }

        .stats {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #05d9e8;
            font-size: 11px;
            opacity: 0.6;
            text-shadow: 0 0 5px #05d9e8;
        }

        .instructions {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #ff2a6d;
            font-size: 11px;
            text-align: right;
            opacity: 0.7;
            text-shadow: 0 0 5px #ff2a6d;
        }
    </style>
</head>
<body>
    <canvas id="neural"></canvas>

    <div class="ui-overlay">
        <div class="title">NEURAL_NET</div>
        <div class="subtitle">SYNAPTIC INTERFACE v2.7</div>
    </div>

    <div class="stats" id="stats">
        NEURONS: 0 | SYNAPSES: 0 | SIGNALS: 0
    </div>

    <div class="instructions">
        CLICK NODE TO ACTIVATE<br>
        WATCH SIGNALS PROPAGATE
    </div>

    <script>
        const canvas = document.getElementById('neural');
        const ctx = canvas.getContext('2d');
        const stats = document.getElementById('stats');

        let width, height;
        let neurons = [];
        let connections = [];
        let signals = [];
        let mouseX = 0, mouseY = 0;
        let hoveredNeuron = null;

        // Colors
        const COLORS = {
            bg: '#0a0a0f',
            bgGradient1: '#0f0a1a',
            bgGradient2: '#1a0a2e',
            pink: '#ff2a6d',
            cyan: '#05d9e8',
            purple: '#9d4edd',
            darkPurple: '#3c096c',
            white: '#ffffff'
        };

        // Configuration
        const config = {
            layers: [8, 12, 16, 12, 8],
            neuronRadius: 8,
            connectionOpacity: 0.15,
            signalSpeed: 3,
            signalLife: 120,
            pulseFrequency: 0.02,
            autoActivateInterval: 2000
        };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initNetwork();
        }

        function initNetwork() {
            neurons = [];
            connections = [];
            signals = [];

            const layerCount = config.layers.length;
            const layerSpacing = width / (layerCount + 1);
            const verticalPadding = 100;

            // Create neurons for each layer
            config.layers.forEach((count, layerIndex) => {
                const x = layerSpacing * (layerIndex + 1);
                const availableHeight = height - verticalPadding * 2;
                const neuronSpacing = availableHeight / (count + 1);

                for (let i = 0; i < count; i++) {
                    const y = verticalPadding + neuronSpacing * (i + 1);

                    // Add some organic variation
                    const offsetX = (Math.random() - 0.5) * 30;
                    const offsetY = (Math.random() - 0.5) * 20;

                    neurons.push({
                        x: x + offsetX,
                        y: y + offsetY,
                        layer: layerIndex,
                        index: i,
                        activation: 0,
                        baseActivation: Math.random() * 0.2,
                        pulsePhase: Math.random() * Math.PI * 2,
                        pulseSpeed: 0.02 + Math.random() * 0.02,
                        size: config.neuronRadius + (Math.random() - 0.5) * 4,
                        connections: []
                    });
                }
            });

            // Create connections between layers
            for (let l = 0; l < layerCount - 1; l++) {
                const currentLayer = neurons.filter(n => n.layer === l);
                const nextLayer = neurons.filter(n => n.layer === l + 1);

                currentLayer.forEach(source => {
                    // Connect to random subset of next layer
                    const connectionCount = Math.floor(nextLayer.length * (0.4 + Math.random() * 0.3));
                    const shuffled = [...nextLayer].sort(() => Math.random() - 0.5);

                    for (let i = 0; i < connectionCount; i++) {
                        const target = shuffled[i];
                        const weight = 0.3 + Math.random() * 0.7;

                        const connection = {
                            source,
                            target,
                            weight,
                            activity: 0
                        };

                        connections.push(connection);
                        source.connections.push(connection);
                    }
                });
            }

            // Add some skip connections for visual interest
            for (let l = 0; l < layerCount - 2; l++) {
                const currentLayer = neurons.filter(n => n.layer === l);
                const skipLayer = neurons.filter(n => n.layer === l + 2);

                currentLayer.forEach(source => {
                    if (Math.random() < 0.15) {
                        const target = skipLayer[Math.floor(Math.random() * skipLayer.length)];
                        const connection = {
                            source,
                            target,
                            weight: 0.2 + Math.random() * 0.3,
                            activity: 0,
                            isSkip: true
                        };
                        connections.push(connection);
                        source.connections.push(connection);
                    }
                });
            }
        }

        function activateNeuron(neuron, strength = 1) {
            neuron.activation = Math.min(1, neuron.activation + strength);

            // Create signals to connected neurons
            neuron.connections.forEach(conn => {
                if (Math.random() < conn.weight * 0.8) {
                    signals.push({
                        connection: conn,
                        progress: 0,
                        speed: config.signalSpeed * (0.8 + Math.random() * 0.4),
                        strength: strength * conn.weight,
                        color: Math.random() < 0.5 ? COLORS.pink : COLORS.cyan
                    });
                    conn.activity = 1;
                }
            });
        }

        function update() {
            // Update neuron activations
            neurons.forEach(neuron => {
                // Natural pulse
                neuron.pulsePhase += neuron.pulseSpeed;
                const pulse = Math.sin(neuron.pulsePhase) * 0.5 + 0.5;

                // Decay activation
                neuron.activation *= 0.97;

                // Minimum glow from base activation
                neuron.displayActivation = Math.max(
                    neuron.baseActivation + pulse * 0.1,
                    neuron.activation
                );
            });

            // Update connection activity
            connections.forEach(conn => {
                conn.activity *= 0.95;
            });

            // Update signals
            for (let i = signals.length - 1; i >= 0; i--) {
                const signal = signals[i];
                signal.progress += signal.speed / 100;

                if (signal.progress >= 1) {
                    // Activate target neuron
                    activateNeuron(signal.connection.target, signal.strength * 0.7);
                    signals.splice(i, 1);
                }
            }

            // Update stats
            const activeNeurons = neurons.filter(n => n.activation > 0.1).length;
            stats.textContent = `NEURONS: ${neurons.length} | SYNAPSES: ${connections.length} | SIGNALS: ${signals.length} | ACTIVE: ${activeNeurons}`;
        }

        function drawBackground() {
            // Create gradient background
            const gradient = ctx.createRadialGradient(
                width / 2, height / 2, 0,
                width / 2, height / 2, Math.max(width, height) * 0.7
            );
            gradient.addColorStop(0, COLORS.bgGradient2);
            gradient.addColorStop(1, COLORS.bg);

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Add subtle grid
            ctx.strokeStyle = 'rgba(5, 217, 232, 0.03)';
            ctx.lineWidth = 1;
            const gridSize = 50;

            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
        }

        function drawConnections() {
            connections.forEach(conn => {
                const { source, target, weight, activity, isSkip } = conn;

                // Calculate control points for curved connections
                const midX = (source.x + target.x) / 2;
                const midY = (source.y + target.y) / 2;
                const dx = target.x - source.x;
                const dy = target.y - source.y;

                // Curve offset based on layer distance
                const curveOffset = isSkip ? 40 : 20;
                const controlX = midX + (Math.random() - 0.5) * curveOffset;
                const controlY = midY;

                // Base connection
                const baseOpacity = config.connectionOpacity * weight;
                const activeOpacity = baseOpacity + activity * 0.5;

                ctx.beginPath();
                ctx.moveTo(source.x, source.y);
                ctx.quadraticCurveTo(controlX, controlY, target.x, target.y);

                // Gradient along connection
                const gradient = ctx.createLinearGradient(source.x, source.y, target.x, target.y);
                const color = isSkip ? COLORS.purple : COLORS.cyan;
                gradient.addColorStop(0, `rgba(${hexToRgb(color)}, ${activeOpacity})`);
                gradient.addColorStop(0.5, `rgba(${hexToRgb(COLORS.pink)}, ${activeOpacity * 0.7})`);
                gradient.addColorStop(1, `rgba(${hexToRgb(color)}, ${activeOpacity})`);

                ctx.strokeStyle = gradient;
                ctx.lineWidth = 1 + activity * 2;
                ctx.stroke();

                // Glow effect for active connections
                if (activity > 0.1) {
                    ctx.beginPath();
                    ctx.moveTo(source.x, source.y);
                    ctx.quadraticCurveTo(controlX, controlY, target.x, target.y);
                    ctx.strokeStyle = `rgba(${hexToRgb(COLORS.pink)}, ${activity * 0.3})`;
                    ctx.lineWidth = 4 + activity * 4;
                    ctx.stroke();
                }
            });
        }

        function drawSignals() {
            signals.forEach(signal => {
                const { connection, progress, strength, color } = signal;
                const { source, target } = connection;

                // Calculate position along curve
                const t = progress;
                const midX = (source.x + target.x) / 2;
                const midY = (source.y + target.y) / 2;

                // Quadratic bezier position
                const x = (1-t)*(1-t)*source.x + 2*(1-t)*t*midX + t*t*target.x;
                const y = (1-t)*(1-t)*source.y + 2*(1-t)*t*midY + t*t*target.y;

                // Draw signal glow
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, 20 * strength);
                gradient.addColorStop(0, color);
                gradient.addColorStop(0.3, `rgba(${hexToRgb(color)}, 0.5)`);
                gradient.addColorStop(1, 'transparent');

                ctx.beginPath();
                ctx.arc(x, y, 20 * strength, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                // Core of signal
                ctx.beginPath();
                ctx.arc(x, y, 3 * strength, 0, Math.PI * 2);
                ctx.fillStyle = COLORS.white;
                ctx.fill();

                // Trail
                for (let i = 1; i <= 5; i++) {
                    const trailT = Math.max(0, progress - i * 0.02);
                    const trailX = (1-trailT)*(1-trailT)*source.x + 2*(1-trailT)*trailT*midX + trailT*trailT*target.x;
                    const trailY = (1-trailT)*(1-trailT)*source.y + 2*(1-trailT)*trailT*midY + trailT*trailT*target.y;

                    ctx.beginPath();
                    ctx.arc(trailX, trailY, 2 * strength * (1 - i * 0.15), 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${hexToRgb(color)}, ${0.5 - i * 0.1})`;
                    ctx.fill();
                }
            });
        }

        function drawNeurons() {
            neurons.forEach(neuron => {
                const { x, y, size, displayActivation, layer } = neuron;
                const isHovered = neuron === hoveredNeuron;

                // Determine color based on layer
                let baseColor;
                if (layer === 0) baseColor = COLORS.cyan;
                else if (layer === config.layers.length - 1) baseColor = COLORS.pink;
                else baseColor = COLORS.purple;

                // Outer glow
                const glowSize = size * (2 + displayActivation * 3);
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, glowSize);
                gradient.addColorStop(0, `rgba(${hexToRgb(baseColor)}, ${0.3 + displayActivation * 0.4})`);
                gradient.addColorStop(0.5, `rgba(${hexToRgb(baseColor)}, ${0.1 + displayActivation * 0.2})`);
                gradient.addColorStop(1, 'transparent');

                ctx.beginPath();
                ctx.arc(x, y, glowSize, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                // Neuron body
                const bodyGradient = ctx.createRadialGradient(x - size/3, y - size/3, 0, x, y, size);
                bodyGradient.addColorStop(0, COLORS.white);
                bodyGradient.addColorStop(0.3, baseColor);
                bodyGradient.addColorStop(1, COLORS.darkPurple);

                ctx.beginPath();
                ctx.arc(x, y, size * (1 + displayActivation * 0.3), 0, Math.PI * 2);
                ctx.fillStyle = bodyGradient;
                ctx.fill();

                // Highlight ring for hovered neuron
                if (isHovered) {
                    ctx.beginPath();
                    ctx.arc(x, y, size * 1.8, 0, Math.PI * 2);
                    ctx.strokeStyle = COLORS.white;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                // Active pulse ring
                if (displayActivation > 0.3) {
                    ctx.beginPath();
                    ctx.arc(x, y, size * (1.5 + displayActivation), 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(${hexToRgb(baseColor)}, ${displayActivation * 0.5})`;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            });
        }

        function draw() {
            drawBackground();
            drawConnections();
            drawSignals();
            drawNeurons();
        }

        function animate() {
            update();
            draw();
            requestAnimationFrame(animate);
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result
                ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}`
                : '255, 255, 255';
        }

        function findNeuronAt(x, y) {
            for (let i = neurons.length - 1; i >= 0; i--) {
                const neuron = neurons[i];
                const dx = x - neuron.x;
                const dy = y - neuron.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < neuron.size * 2) {
                    return neuron;
                }
            }
            return null;
        }

        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            hoveredNeuron = findNeuronAt(mouseX, mouseY);
            canvas.style.cursor = hoveredNeuron ? 'pointer' : 'default';
        });

        canvas.addEventListener('click', (e) => {
            const clickedNeuron = findNeuronAt(e.clientX, e.clientY);
            if (clickedNeuron) {
                activateNeuron(clickedNeuron, 1);
            }
        });

        // Auto-activate random input neurons periodically
        function autoActivate() {
            const inputNeurons = neurons.filter(n => n.layer === 0);
            if (inputNeurons.length > 0) {
                const randomNeuron = inputNeurons[Math.floor(Math.random() * inputNeurons.length)];
                activateNeuron(randomNeuron, 0.5 + Math.random() * 0.5);
            }
        }

        window.addEventListener('resize', resize);

        // Initialize
        resize();
        animate();

        // Start auto-activation after a brief delay
        setTimeout(() => {
            setInterval(autoActivate, config.autoActivateInterval);
            // Initial burst of activity
            for (let i = 0; i < 3; i++) {
                setTimeout(autoActivate, i * 300);
            }
        }, 500);
    </script>
</body>
</html>

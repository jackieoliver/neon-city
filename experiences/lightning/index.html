<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightning Generator | Electric Chaos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #0a0a0f;
            cursor: crosshair;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        #bgCanvas {
            z-index: 1;
        }

        #lightningCanvas {
            z-index: 2;
        }

        #flashOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 3;
            transition: opacity 0.05s ease-out;
        }

        .instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Courier New', monospace;
            font-size: 14px;
            z-index: 10;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(5, 217, 232, 0.5);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>
    <canvas id="lightningCanvas"></canvas>
    <div id="flashOverlay"></div>
    <div class="instructions">Click to strike lightning</div>

    <script>
        // Canvas setup
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const lightningCanvas = document.getElementById('lightningCanvas');
        const ctx = lightningCanvas.getContext('2d');
        const flashOverlay = document.getElementById('flashOverlay');

        let width, height;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            bgCanvas.width = width;
            bgCanvas.height = height;
            lightningCanvas.width = width;
            lightningCanvas.height = height;
        }

        resize();
        window.addEventListener('resize', resize);

        // Neon colors
        const NEON_CYAN = '#05d9e8';
        const NEON_PINK = '#ff2a6d';
        const WHITE = '#ffffff';

        // Lightning bolt class
        class LightningBolt {
            constructor(startX, startY, endX, endY, options = {}) {
                this.startX = startX;
                this.startY = startY;
                this.endX = endX;
                this.endY = endY;
                this.segments = options.segments || 12;
                this.maxOffset = options.maxOffset || 80;
                this.branchChance = options.branchChance || 0.3;
                this.branchDepth = options.branchDepth || 0;
                this.maxBranchDepth = options.maxBranchDepth || 3;
                this.color = options.color || NEON_CYAN;
                this.alpha = options.alpha || 1;
                this.fadeSpeed = options.fadeSpeed || 0.03;
                this.lineWidth = options.lineWidth || 3;
                this.branches = [];
                this.points = [];
                this.generatePoints();
            }

            generatePoints() {
                this.points = [];
                const dx = this.endX - this.startX;
                const dy = this.endY - this.startY;

                for (let i = 0; i <= this.segments; i++) {
                    const t = i / this.segments;
                    let x = this.startX + dx * t;
                    let y = this.startY + dy * t;

                    if (i > 0 && i < this.segments) {
                        const offset = (Math.random() - 0.5) * this.maxOffset * (1 - Math.abs(t - 0.5) * 0.5);
                        const perpX = -dy / Math.sqrt(dx * dx + dy * dy);
                        const perpY = dx / Math.sqrt(dx * dx + dy * dy);
                        x += perpX * offset;
                        y += perpY * offset;
                    }

                    this.points.push({ x, y });

                    // Create branches
                    if (i > 0 && i < this.segments - 1 &&
                        this.branchDepth < this.maxBranchDepth &&
                        Math.random() < this.branchChance) {
                        const branchLength = Math.sqrt(dx * dx + dy * dy) * (0.3 + Math.random() * 0.4);
                        const angle = Math.atan2(dy, dx) + (Math.random() - 0.5) * Math.PI * 0.8;
                        const branchEndX = x + Math.cos(angle) * branchLength;
                        const branchEndY = y + Math.sin(angle) * branchLength;

                        this.branches.push(new LightningBolt(x, y, branchEndX, branchEndY, {
                            segments: Math.max(4, this.segments - 3),
                            maxOffset: this.maxOffset * 0.6,
                            branchChance: this.branchChance * 0.5,
                            branchDepth: this.branchDepth + 1,
                            maxBranchDepth: this.maxBranchDepth,
                            color: this.color,
                            alpha: this.alpha * 0.7,
                            fadeSpeed: this.fadeSpeed,
                            lineWidth: Math.max(1, this.lineWidth - 1)
                        }));
                    }
                }
            }

            update() {
                this.alpha -= this.fadeSpeed;
                this.branches.forEach(branch => branch.update());
                return this.alpha > 0;
            }

            draw(ctx) {
                if (this.alpha <= 0) return;

                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                // Outer glow
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.lineWidth + 20;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 40;
                ctx.globalAlpha = this.alpha * 0.2;
                this.drawPath(ctx);

                // Middle glow
                ctx.lineWidth = this.lineWidth + 8;
                ctx.shadowBlur = 20;
                ctx.globalAlpha = this.alpha * 0.5;
                this.drawPath(ctx);

                // Core
                ctx.strokeStyle = WHITE;
                ctx.lineWidth = this.lineWidth;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 15;
                ctx.globalAlpha = this.alpha;
                this.drawPath(ctx);

                ctx.restore();

                // Draw branches
                this.branches.forEach(branch => branch.draw(ctx));
            }

            drawPath(ctx) {
                if (this.points.length < 2) return;
                ctx.beginPath();
                ctx.moveTo(this.points[0].x, this.points[0].y);
                for (let i = 1; i < this.points.length; i++) {
                    ctx.lineTo(this.points[i].x, this.points[i].y);
                }
                ctx.stroke();
            }
        }

        // Electric arc class
        class ElectricArc {
            constructor(x1, y1, x2, y2, color) {
                this.x1 = x1;
                this.y1 = y1;
                this.x2 = x2;
                this.y2 = y2;
                this.color = color;
                this.alpha = 1;
                this.fadeSpeed = 0.02;
                this.jitter = 30;
                this.segments = 20;
            }

            update() {
                this.alpha -= this.fadeSpeed;
                return this.alpha > 0;
            }

            draw(ctx) {
                if (this.alpha <= 0) return;

                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 20;

                const dx = this.x2 - this.x1;
                const dy = this.y2 - this.y1;
                const perpX = -dy / Math.sqrt(dx * dx + dy * dy);
                const perpY = dx / Math.sqrt(dx * dx + dy * dy);

                ctx.beginPath();
                ctx.moveTo(this.x1, this.y1);

                for (let i = 1; i < this.segments; i++) {
                    const t = i / this.segments;
                    const x = this.x1 + dx * t + perpX * (Math.random() - 0.5) * this.jitter;
                    const y = this.y1 + dy * t + perpY * (Math.random() - 0.5) * this.jitter;
                    ctx.lineTo(x, y);
                }

                ctx.lineTo(this.x2, this.y2);
                ctx.stroke();

                // White core
                ctx.strokeStyle = WHITE;
                ctx.lineWidth = 1;
                ctx.shadowBlur = 10;
                ctx.stroke();

                ctx.restore();
            }
        }

        // Storm cloud particles
        class CloudParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height * 0.4;
                this.radius = Math.random() * 100 + 50;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.alpha = Math.random() * 0.3 + 0.1;
            }

            update() {
                this.x += this.vx;
                if (this.x < -this.radius) this.x = width + this.radius;
                if (this.x > width + this.radius) this.x = -this.radius;
            }

            draw(ctx) {
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.radius
                );
                gradient.addColorStop(0, `rgba(30, 30, 50, ${this.alpha})`);
                gradient.addColorStop(1, 'rgba(30, 30, 50, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // State management
        let lightningBolts = [];
        let electricArcs = [];
        let cloudParticles = [];
        let arcPoints = [];
        let ambientFlashes = [];
        let lastTime = 0;
        let ambientTimer = 0;

        // Initialize clouds
        for (let i = 0; i < 30; i++) {
            cloudParticles.push(new CloudParticle());
        }

        // Thunder flash effect
        function thunderFlash(intensity = 1) {
            flashOverlay.style.opacity = 0.6 * intensity;
            setTimeout(() => {
                flashOverlay.style.opacity = 0.2 * intensity;
                setTimeout(() => {
                    flashOverlay.style.opacity = 0;
                }, 50);
            }, 50);
        }

        // Create lightning strike
        function createLightningStrike(x, y) {
            const colors = [NEON_CYAN, NEON_PINK, WHITE];
            const color = colors[Math.floor(Math.random() * colors.length)];

            // Main bolt from top
            const startX = x + (Math.random() - 0.5) * 200;
            const bolt = new LightningBolt(startX, -50, x, y, {
                segments: 15,
                maxOffset: 100,
                branchChance: 0.4,
                color: color,
                lineWidth: 4,
                fadeSpeed: 0.02
            });
            lightningBolts.push(bolt);

            // Secondary bolts
            for (let i = 0; i < 2; i++) {
                const startX2 = x + (Math.random() - 0.5) * 300;
                const endX2 = x + (Math.random() - 0.5) * 100;
                const bolt2 = new LightningBolt(startX2, -50, endX2, y + Math.random() * 50, {
                    segments: 12,
                    maxOffset: 80,
                    branchChance: 0.3,
                    color: color,
                    alpha: 0.7,
                    lineWidth: 2,
                    fadeSpeed: 0.025
                });
                lightningBolts.push(bolt2);
            }

            // Ground scatter arcs
            for (let i = 0; i < 5; i++) {
                const arcEndX = x + (Math.random() - 0.5) * 300;
                const arcEndY = y + Math.random() * 100 + 50;
                electricArcs.push(new ElectricArc(x, y, arcEndX, arcEndY, color));
            }

            thunderFlash(1);
        }

        // Create ambient lightning in background
        function createAmbientLightning() {
            const colors = [NEON_CYAN, NEON_PINK];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const startX = Math.random() * width;
            const endX = startX + (Math.random() - 0.5) * 300;
            const endY = Math.random() * height * 0.6 + 100;

            const bolt = new LightningBolt(startX, -50, endX, endY, {
                segments: 10,
                maxOffset: 60,
                branchChance: 0.25,
                color: color,
                alpha: 0.4,
                lineWidth: 2,
                fadeSpeed: 0.015
            });
            lightningBolts.push(bolt);
            thunderFlash(0.3);
        }

        // Mouse click handler
        lightningCanvas.addEventListener('click', (e) => {
            createLightningStrike(e.clientX, e.clientY);
            arcPoints.push({ x: e.clientX, y: e.clientY, time: Date.now() });

            // Clean old arc points
            arcPoints = arcPoints.filter(p => Date.now() - p.time < 3000);

            // Create arcs between recent points
            if (arcPoints.length > 1) {
                const last = arcPoints[arcPoints.length - 1];
                for (let i = 0; i < arcPoints.length - 1; i++) {
                    const p = arcPoints[i];
                    const dist = Math.sqrt((last.x - p.x) ** 2 + (last.y - p.y) ** 2);
                    if (dist < 500) {
                        const color = Math.random() > 0.5 ? NEON_CYAN : NEON_PINK;
                        electricArcs.push(new ElectricArc(last.x, last.y, p.x, p.y, color));
                    }
                }
            }
        });

        // Draw stormy background
        function drawBackground() {
            // Dark gradient sky
            const gradient = bgCtx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#0a0a15');
            gradient.addColorStop(0.5, '#0f0f1a');
            gradient.addColorStop(1, '#0a0a12');
            bgCtx.fillStyle = gradient;
            bgCtx.fillRect(0, 0, width, height);

            // Draw cloud particles
            cloudParticles.forEach(cloud => {
                cloud.update();
                cloud.draw(bgCtx);
            });

            // Subtle ambient glow at horizon
            const horizonGlow = bgCtx.createRadialGradient(
                width / 2, height, 0,
                width / 2, height, height * 0.8
            );
            horizonGlow.addColorStop(0, 'rgba(5, 217, 232, 0.05)');
            horizonGlow.addColorStop(1, 'transparent');
            bgCtx.fillStyle = horizonGlow;
            bgCtx.fillRect(0, 0, width, height);
        }

        // Main animation loop
        function animate(time) {
            const deltaTime = time - lastTime;
            lastTime = time;

            // Clear lightning canvas
            ctx.clearRect(0, 0, width, height);

            // Draw background
            drawBackground();

            // Ambient lightning timer
            ambientTimer += deltaTime;
            if (ambientTimer > 2000 + Math.random() * 3000) {
                if (Math.random() > 0.5) {
                    createAmbientLightning();
                }
                ambientTimer = 0;
            }

            // Update and draw lightning bolts
            lightningBolts = lightningBolts.filter(bolt => {
                const alive = bolt.update();
                if (alive) bolt.draw(ctx);
                return alive;
            });

            // Update and draw electric arcs
            electricArcs = electricArcs.filter(arc => {
                const alive = arc.update();
                if (alive) arc.draw(ctx);
                return alive;
            });

            // Continuous small arcs between recent points
            if (arcPoints.length > 1 && Math.random() > 0.9) {
                const i = Math.floor(Math.random() * (arcPoints.length - 1));
                const j = i + 1 + Math.floor(Math.random() * (arcPoints.length - i - 1));
                if (j < arcPoints.length) {
                    const color = Math.random() > 0.5 ? NEON_CYAN : NEON_PINK;
                    electricArcs.push(new ElectricArc(
                        arcPoints[i].x, arcPoints[i].y,
                        arcPoints[j].x, arcPoints[j].y,
                        color
                    ));
                }
            }

            requestAnimationFrame(animate);
        }

        // Start animation
        requestAnimationFrame(animate);

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                // Storm surge - multiple random strikes
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        createLightningStrike(
                            Math.random() * width,
                            Math.random() * height * 0.7 + height * 0.3
                        );
                    }, i * 100);
                }
            }
        });
    </script>
</body>
</html>

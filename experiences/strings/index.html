<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Neon String Art</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            cursor: crosshair;
        }

        canvas {
            display: block;
        }

        .info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #05d9e8;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.6;
            text-shadow: 0 0 10px #05d9e8;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        .info.hidden {
            opacity: 0;
        }

        .pattern-name {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff2a6d;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 20px #ff2a6d;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .pattern-name.visible {
            opacity: 1;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="info">Click anywhere to generate new pattern</div>
    <div class="pattern-name" id="patternName"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const patternNameEl = document.getElementById('patternName');
        const infoEl = document.querySelector('.info');

        let width, height, centerX, centerY;
        let patterns = [];
        let animationId;
        let lastTime = 0;
        let hideInfoTimeout;

        const NEON_COLORS = [
            '#ff2a6d',
            '#05d9e8',
            '#d300c5',
            '#ff6b35',
            '#00ff9f',
            '#7b2cbf'
        ];

        const PATTERN_NAMES = [
            'Cardioid Pulse',
            'Parabolic Wave',
            'Hypotrochoid Dream',
            'Epitrochoid Spiral',
            'Rose Curve',
            'Lissajous Flow',
            'Spirograph Echo',
            'Astroid Bloom'
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        class StringPattern {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.type = Math.floor(Math.random() * 8);
                this.color1 = NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)];
                this.color2 = NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)];
                while (this.color2 === this.color1) {
                    this.color2 = NEON_COLORS[Math.floor(Math.random() * NEON_COLORS.length)];
                }
                this.points = Math.floor(Math.random() * 60) + 40;
                this.radius = Math.min(width, height) * (0.2 + Math.random() * 0.2);
                this.multiplier = 2 + Math.random() * 3;
                this.rotation = 0;
                this.rotationSpeed = (Math.random() - 0.5) * 0.005;
                this.progress = 0;
                this.drawSpeed = 0.02 + Math.random() * 0.02;
                this.opacity = 0;
                this.fadeIn = true;
                this.phase = Math.random() * Math.PI * 2;
                this.strings = [];
                this.generateStrings();
            }

            generateStrings() {
                this.strings = [];

                switch(this.type) {
                    case 0: this.generateCardioid(); break;
                    case 1: this.generateParabola(); break;
                    case 2: this.generateHypotrochoid(); break;
                    case 3: this.generateEpitrochoid(); break;
                    case 4: this.generateRoseCurve(); break;
                    case 5: this.generateLissajous(); break;
                    case 6: this.generateSpirograph(); break;
                    case 7: this.generateAstroid(); break;
                }
            }

            generateCardioid() {
                const n = this.points;
                for (let i = 0; i < n; i++) {
                    const angle1 = (i / n) * Math.PI * 2;
                    const j = Math.floor(i * this.multiplier) % n;
                    const angle2 = (j / n) * Math.PI * 2;

                    this.strings.push({
                        x1: Math.cos(angle1) * this.radius,
                        y1: Math.sin(angle1) * this.radius,
                        x2: Math.cos(angle2) * this.radius,
                        y2: Math.sin(angle2) * this.radius,
                        color: i % 2 === 0 ? this.color1 : this.color2
                    });
                }
            }

            generateParabola() {
                const n = this.points;
                const size = this.radius;

                for (let i = 0; i <= n; i++) {
                    const t = i / n;
                    this.strings.push({
                        x1: -size + t * size * 2,
                        y1: -size,
                        x2: -size,
                        y2: -size + t * size * 2,
                        color: this.color1
                    });

                    this.strings.push({
                        x1: size - t * size * 2,
                        y1: -size,
                        x2: size,
                        y2: -size + t * size * 2,
                        color: this.color2
                    });
                }
            }

            generateHypotrochoid() {
                const n = this.points * 3;
                const R = this.radius;
                const r = R / (2 + Math.floor(Math.random() * 4));
                const d = r * (0.5 + Math.random());

                let prevX = R - r + d;
                let prevY = 0;

                for (let i = 1; i <= n; i++) {
                    const t = (i / n) * Math.PI * 8;
                    const x = (R - r) * Math.cos(t) + d * Math.cos((R - r) / r * t);
                    const y = (R - r) * Math.sin(t) - d * Math.sin((R - r) / r * t);

                    this.strings.push({
                        x1: prevX,
                        y1: prevY,
                        x2: x,
                        y2: y,
                        color: i % 3 === 0 ? this.color1 : this.color2
                    });

                    prevX = x;
                    prevY = y;
                }
            }

            generateEpitrochoid() {
                const n = this.points * 3;
                const R = this.radius * 0.5;
                const r = R / (3 + Math.floor(Math.random() * 3));
                const d = r * (1 + Math.random());

                let prevX = R + r + d;
                let prevY = 0;

                for (let i = 1; i <= n; i++) {
                    const t = (i / n) * Math.PI * 10;
                    const x = (R + r) * Math.cos(t) - d * Math.cos((R + r) / r * t);
                    const y = (R + r) * Math.sin(t) - d * Math.sin((R + r) / r * t);

                    this.strings.push({
                        x1: prevX,
                        y1: prevY,
                        x2: x,
                        y2: y,
                        color: i % 2 === 0 ? this.color1 : this.color2
                    });

                    prevX = x;
                    prevY = y;
                }
            }

            generateRoseCurve() {
                const n = this.points * 2;
                const k = Math.floor(Math.random() * 5) + 3;

                for (let i = 0; i < n; i++) {
                    const t1 = (i / n) * Math.PI * 2;
                    const t2 = ((i + 1) / n) * Math.PI * 2;

                    const r1 = this.radius * Math.cos(k * t1);
                    const r2 = this.radius * Math.cos(k * t2);

                    this.strings.push({
                        x1: r1 * Math.cos(t1),
                        y1: r1 * Math.sin(t1),
                        x2: r2 * Math.cos(t2),
                        y2: r2 * Math.sin(t2),
                        color: i % 2 === 0 ? this.color1 : this.color2
                    });

                    if (i % 3 === 0) {
                        this.strings.push({
                            x1: 0,
                            y1: 0,
                            x2: r1 * Math.cos(t1),
                            y2: r1 * Math.sin(t1),
                            color: this.color2
                        });
                    }
                }
            }

            generateLissajous() {
                const n = this.points * 2;
                const a = Math.floor(Math.random() * 4) + 2;
                const b = Math.floor(Math.random() * 4) + 3;
                const delta = Math.PI / (2 + Math.random() * 4);

                let prevX = this.radius * Math.sin(delta);
                let prevY = 0;

                for (let i = 1; i <= n; i++) {
                    const t = (i / n) * Math.PI * 2;
                    const x = this.radius * Math.sin(a * t + delta);
                    const y = this.radius * Math.sin(b * t);

                    this.strings.push({
                        x1: prevX,
                        y1: prevY,
                        x2: x,
                        y2: y,
                        color: i % 2 === 0 ? this.color1 : this.color2
                    });

                    prevX = x;
                    prevY = y;
                }
            }

            generateSpirograph() {
                const n = this.points;

                for (let i = 0; i < n; i++) {
                    const angle = (i / n) * Math.PI * 2;
                    const innerAngle = angle * this.multiplier;

                    const outerX = Math.cos(angle) * this.radius;
                    const outerY = Math.sin(angle) * this.radius;
                    const innerX = Math.cos(innerAngle) * this.radius * 0.5;
                    const innerY = Math.sin(innerAngle) * this.radius * 0.5;

                    this.strings.push({
                        x1: outerX,
                        y1: outerY,
                        x2: innerX,
                        y2: innerY,
                        color: i % 2 === 0 ? this.color1 : this.color2
                    });
                }
            }

            generateAstroid() {
                const n = this.points;

                for (let i = 0; i < n; i++) {
                    const t1 = (i / n) * Math.PI * 2;
                    const t2 = ((i + 5) % n / n) * Math.PI * 2;

                    const x1 = this.radius * Math.pow(Math.cos(t1), 3);
                    const y1 = this.radius * Math.pow(Math.sin(t1), 3);
                    const x2 = this.radius * Math.pow(Math.cos(t2), 3);
                    const y2 = this.radius * Math.pow(Math.sin(t2), 3);

                    this.strings.push({
                        x1, y1, x2, y2,
                        color: i % 2 === 0 ? this.color1 : this.color2
                    });
                }
            }

            update(deltaTime) {
                this.rotation += this.rotationSpeed;

                if (this.fadeIn && this.opacity < 1) {
                    this.opacity = Math.min(1, this.opacity + deltaTime * 0.001);
                }

                if (this.progress < 1) {
                    this.progress = Math.min(1, this.progress + this.drawSpeed * deltaTime * 0.06);
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                const visibleStrings = Math.floor(this.strings.length * this.progress);

                for (let i = 0; i < visibleStrings; i++) {
                    const s = this.strings[i];
                    const stringProgress = i === visibleStrings - 1
                        ? (this.progress * this.strings.length) % 1
                        : 1;

                    const alpha = this.opacity * 0.8;

                    ctx.beginPath();
                    ctx.moveTo(s.x1, s.y1);

                    if (stringProgress < 1) {
                        const x = s.x1 + (s.x2 - s.x1) * stringProgress;
                        const y = s.y1 + (s.y2 - s.y1) * stringProgress;
                        ctx.lineTo(x, y);
                    } else {
                        ctx.lineTo(s.x2, s.y2);
                    }

                    ctx.strokeStyle = s.color;
                    ctx.lineWidth = 1.5;
                    ctx.globalAlpha = alpha;
                    ctx.shadowColor = s.color;
                    ctx.shadowBlur = 15;
                    ctx.stroke();

                    ctx.shadowBlur = 30;
                    ctx.lineWidth = 0.5;
                    ctx.globalAlpha = alpha * 0.5;
                    ctx.stroke();
                }

                ctx.restore();
            }

            getName() {
                return PATTERN_NAMES[this.type];
            }
        }

        function createPattern(x = centerX, y = centerY) {
            const pattern = new StringPattern(x, y);
            patterns.push(pattern);

            patternNameEl.textContent = pattern.getName();
            patternNameEl.classList.add('visible');

            setTimeout(() => {
                patternNameEl.classList.remove('visible');
            }, 2000);

            if (patterns.length > 5) {
                patterns.shift();
            }

            infoEl.classList.add('hidden');
            clearTimeout(hideInfoTimeout);
            hideInfoTimeout = setTimeout(() => {
                infoEl.classList.remove('hidden');
            }, 5000);
        }

        function animate(currentTime) {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            ctx.fillStyle = 'rgba(10, 10, 15, 0.05)';
            ctx.fillRect(0, 0, width, height);

            for (const pattern of patterns) {
                pattern.update(deltaTime);
                pattern.draw();
            }

            animationId = requestAnimationFrame(animate);
        }

        function init() {
            resize();

            setTimeout(() => {
                createPattern();
            }, 500);

            setTimeout(() => {
                createPattern(
                    centerX + (Math.random() - 0.5) * width * 0.3,
                    centerY + (Math.random() - 0.5) * height * 0.3
                );
            }, 2000);
        }

        window.addEventListener('resize', resize);

        canvas.addEventListener('click', (e) => {
            createPattern(e.clientX, e.clientY);
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                patterns = [];
                ctx.fillStyle = '#0a0a0f';
                ctx.fillRect(0, 0, width, height);
                createPattern();
            }
        });

        init();
        requestAnimationFrame(animate);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Boids - Digital Flocking</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        .ui {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            color: #05d9e8;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
            user-select: none;
        }

        .ui .title {
            font-size: 18px;
            color: #ff2a6d;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #ff2a6d;
        }

        .ui .controls {
            margin-top: 10px;
        }

        .ui .key {
            display: inline-block;
            background: rgba(5, 217, 232, 0.1);
            border: 1px solid #05d9e8;
            padding: 2px 8px;
            margin-right: 5px;
            border-radius: 3px;
        }

        .stats {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #00ff9f;
            font-size: 11px;
            text-align: right;
            opacity: 0.6;
        }

        .mode-indicator {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 3px;
            padding: 10px 20px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .mode-indicator.predator {
            color: #ff2a6d;
            background: rgba(255, 42, 109, 0.1);
            border: 1px solid #ff2a6d;
            box-shadow: 0 0 20px rgba(255, 42, 109, 0.3);
        }

        .mode-indicator.attractor {
            color: #00ff9f;
            background: rgba(0, 255, 159, 0.1);
            border: 1px solid #00ff9f;
            box-shadow: 0 0 20px rgba(0, 255, 159, 0.3);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="mode-indicator predator" id="modeIndicator">
        Predator Mode
    </div>

    <div class="ui">
        <div class="title">// NEON BOIDS</div>
        <div>Digital Flocking Simulation</div>
        <div class="controls">
            <span class="key">SPACE</span> Toggle Predator/Attractor
            <br><span class="key">R</span> Reset Flock
            <br><span class="key">+/-</span> Adjust Boid Count
        </div>
    </div>

    <div class="stats" id="stats"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const stats = document.getElementById('stats');
        const modeIndicator = document.getElementById('modeIndicator');

        // Embedded mode detection
        const isEmbedded = window.self !== window.top;
        let isPausedByParent = false;
        let animationId = null;

        // Listen for pause/resume from parent
        window.addEventListener('message', (e) => {
            if (e.data === 'neon-pause') {
                isPausedByParent = true;
            } else if (e.data === 'neon-resume') {
                isPausedByParent = false;
                if (!animationId) animate();
            }
        });

        // Visibility API
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) isPausedByParent = true;
        });

        let width, height;
        let boids = [];
        let trails = [];
        let mouseX = -1000;
        let mouseY = -1000;
        let isPredator = true;
        // REDUCED boid count for embedded mode
        let targetBoidCount = isEmbedded ? 80 : 300;

        // Flock colors - cyberpunk neon palette
        const flockColors = [
            { main: '#ff2a6d', glow: 'rgba(255, 42, 109, 0.8)', trail: 'rgba(255, 42, 109, 0.15)' },
            { main: '#05d9e8', glow: 'rgba(5, 217, 232, 0.8)', trail: 'rgba(5, 217, 232, 0.15)' },
            { main: '#00ff9f', glow: 'rgba(0, 255, 159, 0.8)', trail: 'rgba(0, 255, 159, 0.15)' },
            { main: '#d300c5', glow: 'rgba(211, 0, 197, 0.8)', trail: 'rgba(211, 0, 197, 0.15)' },
            { main: '#ffe900', glow: 'rgba(255, 233, 0, 0.8)', trail: 'rgba(255, 233, 0, 0.15)' }
        ];

        // Boids parameters
        const params = {
            maxSpeed: 4,
            maxForce: 0.15,
            separationDist: 35,
            alignmentDist: 80,
            cohesionDist: 100,
            separationWeight: 2.0,
            alignmentWeight: 1.2,
            cohesionWeight: 1.0,
            mouseRadius: 200,
            mouseForce: 0.8,
            trailLength: 8
        };

        class Boid {
            constructor(x, y, flockId) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * params.maxSpeed * 2;
                this.vy = (Math.random() - 0.5) * params.maxSpeed * 2;
                this.ax = 0;
                this.ay = 0;
                this.flockId = flockId;
                this.color = flockColors[flockId % flockColors.length];
                this.size = 8 + Math.random() * 4;
                this.trail = [];
                this.pulsePhase = Math.random() * Math.PI * 2;
            }

            applyForce(fx, fy) {
                this.ax += fx;
                this.ay += fy;
            }

            // Separation: steer to avoid crowding local flockmates
            separation(boids) {
                let steerX = 0;
                let steerY = 0;
                let count = 0;

                for (const other of boids) {
                    if (other === this) continue;

                    const dx = this.x - other.x;
                    const dy = this.y - other.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < params.separationDist && dist > 0) {
                        // Weight by distance (closer = stronger)
                        const force = 1 / dist;
                        steerX += (dx / dist) * force;
                        steerY += (dy / dist) * force;
                        count++;
                    }
                }

                if (count > 0) {
                    steerX /= count;
                    steerY /= count;

                    // Normalize and scale
                    const mag = Math.sqrt(steerX * steerX + steerY * steerY);
                    if (mag > 0) {
                        steerX = (steerX / mag) * params.maxSpeed - this.vx;
                        steerY = (steerY / mag) * params.maxSpeed - this.vy;

                        // Limit force
                        const forceMag = Math.sqrt(steerX * steerX + steerY * steerY);
                        if (forceMag > params.maxForce) {
                            steerX = (steerX / forceMag) * params.maxForce;
                            steerY = (steerY / forceMag) * params.maxForce;
                        }
                    }
                }

                return { x: steerX * params.separationWeight, y: steerY * params.separationWeight };
            }

            // Alignment: steer towards the average heading of local flockmates
            alignment(boids) {
                let avgVx = 0;
                let avgVy = 0;
                let count = 0;

                for (const other of boids) {
                    if (other === this || other.flockId !== this.flockId) continue;

                    const dx = other.x - this.x;
                    const dy = other.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < params.alignmentDist) {
                        avgVx += other.vx;
                        avgVy += other.vy;
                        count++;
                    }
                }

                if (count > 0) {
                    avgVx /= count;
                    avgVy /= count;

                    // Normalize to max speed
                    const mag = Math.sqrt(avgVx * avgVx + avgVy * avgVy);
                    if (mag > 0) {
                        avgVx = (avgVx / mag) * params.maxSpeed;
                        avgVy = (avgVy / mag) * params.maxSpeed;
                    }

                    // Steering = desired - velocity
                    let steerX = avgVx - this.vx;
                    let steerY = avgVy - this.vy;

                    // Limit force
                    const forceMag = Math.sqrt(steerX * steerX + steerY * steerY);
                    if (forceMag > params.maxForce) {
                        steerX = (steerX / forceMag) * params.maxForce;
                        steerY = (steerY / forceMag) * params.maxForce;
                    }

                    return { x: steerX * params.alignmentWeight, y: steerY * params.alignmentWeight };
                }

                return { x: 0, y: 0 };
            }

            // Cohesion: steer to move toward the average position of local flockmates
            cohesion(boids) {
                let centerX = 0;
                let centerY = 0;
                let count = 0;

                for (const other of boids) {
                    if (other === this || other.flockId !== this.flockId) continue;

                    const dx = other.x - this.x;
                    const dy = other.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < params.cohesionDist) {
                        centerX += other.x;
                        centerY += other.y;
                        count++;
                    }
                }

                if (count > 0) {
                    centerX /= count;
                    centerY /= count;

                    // Desired velocity towards center
                    let desiredX = centerX - this.x;
                    let desiredY = centerY - this.y;

                    // Normalize and scale to max speed
                    const mag = Math.sqrt(desiredX * desiredX + desiredY * desiredY);
                    if (mag > 0) {
                        desiredX = (desiredX / mag) * params.maxSpeed;
                        desiredY = (desiredY / mag) * params.maxSpeed;
                    }

                    // Steering = desired - velocity
                    let steerX = desiredX - this.vx;
                    let steerY = desiredY - this.vy;

                    // Limit force
                    const forceMag = Math.sqrt(steerX * steerX + steerY * steerY);
                    if (forceMag > params.maxForce) {
                        steerX = (steerX / forceMag) * params.maxForce;
                        steerY = (steerY / forceMag) * params.maxForce;
                    }

                    return { x: steerX * params.cohesionWeight, y: steerY * params.cohesionWeight };
                }

                return { x: 0, y: 0 };
            }

            // Mouse interaction (flee or attract)
            mouseInteraction() {
                const dx = this.x - mouseX;
                const dy = this.y - mouseY;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < params.mouseRadius && dist > 0) {
                    const force = (1 - dist / params.mouseRadius) * params.mouseForce;

                    if (isPredator) {
                        // Flee from mouse
                        return { x: (dx / dist) * force, y: (dy / dist) * force };
                    } else {
                        // Attract to mouse
                        return { x: -(dx / dist) * force * 0.5, y: -(dy / dist) * force * 0.5 };
                    }
                }

                return { x: 0, y: 0 };
            }

            // Keep boids on screen with soft boundaries
            boundaries() {
                const margin = 100;
                const turnForce = 0.5;
                let steerX = 0;
                let steerY = 0;

                if (this.x < margin) steerX = turnForce;
                if (this.x > width - margin) steerX = -turnForce;
                if (this.y < margin) steerY = turnForce;
                if (this.y > height - margin) steerY = -turnForce;

                return { x: steerX, y: steerY };
            }

            flock(boids) {
                const sep = this.separation(boids);
                const ali = this.alignment(boids);
                const coh = this.cohesion(boids);
                const mouse = this.mouseInteraction();
                const bounds = this.boundaries();

                this.applyForce(sep.x + ali.x + coh.x + mouse.x + bounds.x,
                               sep.y + ali.y + coh.y + mouse.y + bounds.y);
            }

            update() {
                // Update velocity
                this.vx += this.ax;
                this.vy += this.ay;

                // Limit speed
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > params.maxSpeed) {
                    this.vx = (this.vx / speed) * params.maxSpeed;
                    this.vy = (this.vy / speed) * params.maxSpeed;
                }

                // Update position
                this.x += this.vx;
                this.y += this.vy;

                // Reset acceleration
                this.ax = 0;
                this.ay = 0;

                // Update trail
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > params.trailLength) {
                    this.trail.shift();
                }

                // Update pulse
                this.pulsePhase += 0.1;
            }

            draw() {
                const angle = Math.atan2(this.vy, this.vx);
                const pulse = 0.8 + 0.2 * Math.sin(this.pulsePhase);

                // Draw trail
                if (this.trail.length > 1) {
                    ctx.beginPath();
                    ctx.moveTo(this.trail[0].x, this.trail[0].y);

                    for (let i = 1; i < this.trail.length; i++) {
                        ctx.lineTo(this.trail[i].x, this.trail[i].y);
                    }

                    const gradient = ctx.createLinearGradient(
                        this.trail[0].x, this.trail[0].y,
                        this.x, this.y
                    );
                    gradient.addColorStop(0, 'transparent');
                    gradient.addColorStop(1, this.color.trail);

                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = this.size * 0.3;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }

                // Draw boid body (triangle)
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(angle);

                // Glow effect (skip in embedded mode)
                if (enableShadows) {
                    ctx.shadowColor = this.color.main;
                    ctx.shadowBlur = 15 * pulse;
                }

                ctx.beginPath();
                ctx.moveTo(this.size, 0);
                ctx.lineTo(-this.size * 0.6, -this.size * 0.5);
                ctx.lineTo(-this.size * 0.3, 0);
                ctx.lineTo(-this.size * 0.6, this.size * 0.5);
                ctx.closePath();

                // Fill with gradient
                const bodyGradient = ctx.createLinearGradient(-this.size, 0, this.size, 0);
                bodyGradient.addColorStop(0, this.color.trail);
                bodyGradient.addColorStop(0.5, this.color.main);
                bodyGradient.addColorStop(1, this.color.glow);

                ctx.fillStyle = bodyGradient;
                ctx.fill();

                // Outline
                ctx.strokeStyle = this.color.main;
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.restore();
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }

        function initBoids() {
            boids = [];
            const numFlocks = 5;
            const boidsPerFlock = Math.floor(targetBoidCount / numFlocks);

            for (let f = 0; f < numFlocks; f++) {
                // Each flock starts in a cluster
                const clusterX = Math.random() * (width - 200) + 100;
                const clusterY = Math.random() * (height - 200) + 100;

                for (let i = 0; i < boidsPerFlock; i++) {
                    const x = clusterX + (Math.random() - 0.5) * 200;
                    const y = clusterY + (Math.random() - 0.5) * 200;
                    boids.push(new Boid(x, y, f));
                }
            }
        }

        function drawBackground() {
            // Dark gradient background
            const gradient = ctx.createRadialGradient(
                width / 2, height / 2, 0,
                width / 2, height / 2, Math.max(width, height)
            );
            gradient.addColorStop(0, '#0f0f1a');
            gradient.addColorStop(1, '#050508');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Grid lines for cyberpunk effect
            ctx.strokeStyle = 'rgba(5, 217, 232, 0.03)';
            ctx.lineWidth = 1;

            const gridSize = 50;
            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            // Mouse influence zone
            if (mouseX > 0 && mouseY > 0) {
                const mouseGradient = ctx.createRadialGradient(
                    mouseX, mouseY, 0,
                    mouseX, mouseY, params.mouseRadius
                );

                if (isPredator) {
                    mouseGradient.addColorStop(0, 'rgba(255, 42, 109, 0.15)');
                    mouseGradient.addColorStop(0.5, 'rgba(255, 42, 109, 0.05)');
                    mouseGradient.addColorStop(1, 'transparent');
                } else {
                    mouseGradient.addColorStop(0, 'rgba(0, 255, 159, 0.15)');
                    mouseGradient.addColorStop(0.5, 'rgba(0, 255, 159, 0.05)');
                    mouseGradient.addColorStop(1, 'transparent');
                }

                ctx.fillStyle = mouseGradient;
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, params.mouseRadius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 60;

        // Frame rate limiting for embedded mode
        let lastFrameTime = 0;
        const targetFPS = isEmbedded ? 30 : 60;
        const frameInterval = 1000 / targetFPS;

        // Disable shadows in embedded mode
        const enableShadows = !isEmbedded;

        function animate(timestamp) {
            // Skip if paused
            if (isPausedByParent) {
                animationId = null;
                return;
            }

            // Frame rate limiting
            if (timestamp - lastFrameTime < frameInterval) {
                animationId = requestAnimationFrame(animate);
                return;
            }
            lastFrameTime = timestamp;

            // FPS calculation
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = now;
            }

            drawBackground();

            // Update and draw boids
            for (const boid of boids) {
                boid.flock(boids);
            }

            for (const boid of boids) {
                boid.update();
                boid.draw();
            }

            // Update stats
            stats.innerHTML = `
                FPS: ${fps}<br>
                BOIDS: ${boids.length}<br>
                FLOCKS: 5
            `;

            animationId = requestAnimationFrame(animate);
        }

        // Event listeners
        window.addEventListener('resize', resize);

        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        canvas.addEventListener('mouseleave', () => {
            mouseX = -1000;
            mouseY = -1000;
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                isPredator = !isPredator;
                modeIndicator.className = 'mode-indicator ' + (isPredator ? 'predator' : 'attractor');
                modeIndicator.textContent = isPredator ? 'Predator Mode' : 'Attractor Mode';
            } else if (e.code === 'KeyR') {
                initBoids();
            } else if (e.code === 'Equal' || e.code === 'NumpadAdd') {
                targetBoidCount = Math.min(targetBoidCount + 50, 600);
                initBoids();
            } else if (e.code === 'Minus' || e.code === 'NumpadSubtract') {
                targetBoidCount = Math.max(targetBoidCount - 50, 50);
                initBoids();
            }
        });

        // Touch support
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            mouseX = touch.clientX;
            mouseY = touch.clientY;
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            mouseX = -1000;
            mouseY = -1000;
        });

        // Double tap to toggle mode
        let lastTap = 0;
        canvas.addEventListener('touchstart', (e) => {
            const now = Date.now();
            if (now - lastTap < 300) {
                isPredator = !isPredator;
                modeIndicator.className = 'mode-indicator ' + (isPredator ? 'predator' : 'attractor');
                modeIndicator.textContent = isPredator ? 'Predator Mode' : 'Attractor Mode';
            }
            lastTap = now;
        });

        // Initialize
        resize();
        initBoids();
        animate();
    </script>
</body>
</html>

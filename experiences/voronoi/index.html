<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Voronoi - Digital Stained Glass</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
        }

        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .control-btn {
            background: rgba(5, 217, 232, 0.1);
            border: 1px solid #05d9e8;
            color: #05d9e8;
            padding: 12px 24px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .control-btn:hover {
            background: rgba(5, 217, 232, 0.3);
            box-shadow: 0 0 20px rgba(5, 217, 232, 0.5);
        }

        .control-btn.active {
            background: rgba(255, 42, 109, 0.3);
            border-color: #ff2a6d;
            color: #ff2a6d;
            box-shadow: 0 0 20px rgba(255, 42, 109, 0.5);
        }

        .info {
            position: fixed;
            top: 30px;
            left: 30px;
            color: #05d9e8;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
            z-index: 100;
        }

        .info span {
            color: #ff2a6d;
        }

        .stats {
            position: fixed;
            top: 30px;
            right: 30px;
            color: #00ff9f;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: right;
            opacity: 0.7;
            z-index: 100;
        }

        .title {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 8px;
            opacity: 0;
            pointer-events: none;
            animation: fadeTitle 3s ease-out forwards;
        }

        @keyframes fadeTitle {
            0% { opacity: 0.8; }
            70% { opacity: 0.8; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div class="info">
        Click to add points<br>
        <span>Drag</span> to create trails
    </div>

    <div class="stats" id="stats">
        Points: <span id="pointCount">0</span><br>
        FPS: <span id="fps">0</span>
    </div>

    <div class="controls">
        <button class="control-btn" id="toggleDelaunay">Delaunay</button>
        <button class="control-btn" id="toggleGlow">Glow FX</button>
        <button class="control-btn" id="toggleFill">Fill Cells</button>
        <button class="control-btn" id="reset">Reset</button>
    </div>

    <div class="title">Digital Stained Glass</div>

    <script>
        // Neon color palette
        const COLORS = ['#ff2a6d', '#05d9e8', '#d300c5', '#00ff9f'];

        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let points = [];
        let showDelaunay = false;
        let showGlow = true;
        let showFill = true;
        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 0;

        // Resize handler
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        // Point class with movement
        class Point {
            constructor(x, y, isStatic = false) {
                this.x = x;
                this.y = y;
                this.originX = x;
                this.originY = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
                this.isStatic = isStatic;
                this.angle = Math.random() * Math.PI * 2;
                this.angleSpeed = (Math.random() - 0.5) * 0.02;
                this.radius = 30 + Math.random() * 50;
                this.pulsePhase = Math.random() * Math.PI * 2;
            }

            update() {
                if (this.isStatic) return;

                // Orbital movement around origin
                this.angle += this.angleSpeed;
                const pulse = Math.sin(performance.now() * 0.001 + this.pulsePhase) * 0.3 + 1;

                this.x = this.originX + Math.cos(this.angle) * this.radius * pulse;
                this.y = this.originY + Math.sin(this.angle) * this.radius * pulse;

                // Drift origin slowly
                this.originX += this.vx * 0.1;
                this.originY += this.vy * 0.1;

                // Bounce off edges
                if (this.originX < 50 || this.originX > width - 50) this.vx *= -1;
                if (this.originY < 50 || this.originY > height - 50) this.vy *= -1;

                // Clamp to bounds
                this.originX = Math.max(50, Math.min(width - 50, this.originX));
                this.originY = Math.max(50, Math.min(height - 50, this.originY));
            }
        }

        // Initialize with random points
        function init() {
            points = [];
            const count = Math.floor((width * height) / 25000);
            for (let i = 0; i < count; i++) {
                points.push(new Point(
                    Math.random() * width,
                    Math.random() * height
                ));
            }
        }

        // Fortune's algorithm helper structures
        class Event {
            constructor(x, point, arc) {
                this.x = x;
                this.point = point;
                this.arc = arc;
                this.valid = true;
            }
        }

        class Arc {
            constructor(point, prev = null, next = null) {
                this.point = point;
                this.prev = prev;
                this.next = next;
                this.event = null;
                this.edge = null;
            }
        }

        class Edge {
            constructor(start, left, right) {
                this.start = start;
                this.end = null;
                this.left = left;
                this.right = right;
            }
        }

        // Voronoi computation using Fortune's sweep line algorithm
        function computeVoronoi(sites) {
            if (sites.length < 2) return { edges: [], cells: [] };

            const edges = [];
            let root = null;
            const events = [];

            // Sort sites by x coordinate
            const sortedSites = [...sites].sort((a, b) => a.x - b.x);

            // Add site events
            sortedSites.forEach(site => {
                events.push(new Event(site.x, site, null));
            });

            // Priority queue operations
            events.sort((a, b) => b.x - a.x);

            function getY(p, x) {
                const dx = x - p.x;
                return p.y + Math.sqrt(dx * 2) * (Math.random() > 0.5 ? 1 : -1);
            }

            function intersection(p1, p2, x) {
                let result = { x: 0, y: 0 };
                let p = p1;

                if (p1.x === p2.x) {
                    result.y = (p1.y + p2.y) / 2;
                } else if (p2.x === x) {
                    result.y = p2.y;
                } else if (p1.x === x) {
                    result.y = p1.y;
                    p = p2;
                } else {
                    const z0 = 2 * (p1.x - x);
                    const z1 = 2 * (p2.x - x);

                    const a = 1/z0 - 1/z1;
                    const b = -2 * (p1.y/z0 - p2.y/z1);
                    const c = (p1.y*p1.y + p1.x*p1.x - x*x)/z0 -
                             (p2.y*p2.y + p2.x*p2.x - x*x)/z1;

                    result.y = (-b - Math.sqrt(b*b - 4*a*c)) / (2*a);
                }

                result.x = (p.x*p.x + (p.y - result.y)*(p.y - result.y) - x*x) / (2*p.x - 2*x);
                return result;
            }

            // Simplified Voronoi - use centroid-based approach for stability
            const cells = new Map();
            sites.forEach((site, i) => {
                cells.set(i, { site, vertices: [] });
            });

            // Generate edges between adjacent cells using Delaunay
            const delaunayEdges = computeDelaunayEdges(sites);
            const voronoiEdges = [];

            delaunayEdges.forEach(([i, j]) => {
                const p1 = sites[i];
                const p2 = sites[j];

                // Perpendicular bisector
                const midX = (p1.x + p2.x) / 2;
                const midY = (p1.y + p2.y) / 2;

                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const len = Math.sqrt(dx*dx + dy*dy);

                if (len > 0) {
                    const nx = -dy / len;
                    const ny = dx / len;

                    const ext = Math.max(width, height);
                    voronoiEdges.push({
                        start: { x: midX - nx * ext, y: midY - ny * ext },
                        end: { x: midX + nx * ext, y: midY + ny * ext },
                        left: p1,
                        right: p2
                    });
                }
            });

            return { edges: voronoiEdges, cells };
        }

        // Compute Delaunay triangulation edges using Bowyer-Watson
        function computeDelaunayEdges(points) {
            if (points.length < 2) return [];
            if (points.length === 2) return [[0, 1]];

            // Create super triangle
            const margin = Math.max(width, height) * 10;
            const superTriangle = [
                { x: -margin, y: -margin, index: -1 },
                { x: width + margin, y: -margin, index: -2 },
                { x: width / 2, y: height + margin, index: -3 }
            ];

            let triangles = [superTriangle];

            // Add points one by one
            points.forEach((point, i) => {
                const p = { ...point, index: i };
                const badTriangles = [];

                // Find triangles whose circumcircle contains the point
                triangles.forEach(tri => {
                    if (inCircumcircle(p, tri)) {
                        badTriangles.push(tri);
                    }
                });

                // Find boundary of polygonal hole
                const polygon = [];
                badTriangles.forEach(tri => {
                    for (let j = 0; j < 3; j++) {
                        const edge = [tri[j], tri[(j + 1) % 3]];
                        let shared = false;

                        badTriangles.forEach(other => {
                            if (tri === other) return;
                            for (let k = 0; k < 3; k++) {
                                if ((edge[0] === other[k] && edge[1] === other[(k + 1) % 3]) ||
                                    (edge[1] === other[k] && edge[0] === other[(k + 1) % 3])) {
                                    shared = true;
                                }
                            }
                        });

                        if (!shared) polygon.push(edge);
                    }
                });

                // Remove bad triangles
                triangles = triangles.filter(t => !badTriangles.includes(t));

                // Create new triangles
                polygon.forEach(edge => {
                    triangles.push([edge[0], edge[1], p]);
                });
            });

            // Remove triangles connected to super triangle
            triangles = triangles.filter(tri => {
                return !tri.some(p => p.index < 0);
            });

            // Extract edges
            const edgeSet = new Set();
            triangles.forEach(tri => {
                for (let i = 0; i < 3; i++) {
                    const a = tri[i].index;
                    const b = tri[(i + 1) % 3].index;
                    const key = a < b ? `${a},${b}` : `${b},${a}`;
                    edgeSet.add(key);
                }
            });

            return Array.from(edgeSet).map(key => key.split(',').map(Number));
        }

        // Check if point is inside triangle's circumcircle
        function inCircumcircle(p, tri) {
            const ax = tri[0].x - p.x;
            const ay = tri[0].y - p.y;
            const bx = tri[1].x - p.x;
            const by = tri[1].y - p.y;
            const cx = tri[2].x - p.x;
            const cy = tri[2].y - p.y;

            const det = (ax*ax + ay*ay) * (bx*cy - cx*by) -
                       (bx*bx + by*by) * (ax*cy - cx*ay) +
                       (cx*cx + cy*cy) * (ax*by - bx*ay);

            return det > 0;
        }

        // Clip line to viewport
        function clipLine(x1, y1, x2, y2) {
            const margin = 50;
            const minX = -margin;
            const maxX = width + margin;
            const minY = -margin;
            const maxY = height + margin;

            // Cohen-Sutherland algorithm
            function code(x, y) {
                let c = 0;
                if (x < minX) c |= 1;
                if (x > maxX) c |= 2;
                if (y < minY) c |= 4;
                if (y > maxY) c |= 8;
                return c;
            }

            let c1 = code(x1, y1);
            let c2 = code(x2, y2);

            while (true) {
                if (!(c1 | c2)) return { x1, y1, x2, y2, visible: true };
                if (c1 & c2) return { visible: false };

                let c = c1 || c2;
                let x, y;

                if (c & 8) {
                    x = x1 + (x2 - x1) * (maxY - y1) / (y2 - y1);
                    y = maxY;
                } else if (c & 4) {
                    x = x1 + (x2 - x1) * (minY - y1) / (y2 - y1);
                    y = minY;
                } else if (c & 2) {
                    y = y1 + (y2 - y1) * (maxX - x1) / (x2 - x1);
                    x = maxX;
                } else {
                    y = y1 + (y2 - y1) * (minX - x1) / (x2 - x1);
                    x = minX;
                }

                if (c === c1) {
                    x1 = x; y1 = y;
                    c1 = code(x1, y1);
                } else {
                    x2 = x; y2 = y;
                    c2 = code(x2, y2);
                }
            }
        }

        // Draw a glowing line
        function drawGlowLine(x1, y1, x2, y2, color, lineWidth = 1.5) {
            if (showGlow) {
                ctx.save();
                ctx.shadowColor = color;
                ctx.shadowBlur = 15;
                ctx.strokeStyle = color;
                ctx.lineWidth = lineWidth;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                ctx.restore();
            }

            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth * 0.5;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }

        // Render Voronoi cells with fill
        function renderVoronoiCells(sites) {
            if (!showFill) return;

            // For each pixel region, find nearest site (simplified)
            // Use a grid-based approach for performance
            const gridSize = 3;

            for (let x = 0; x < width; x += gridSize) {
                for (let y = 0; y < height; y += gridSize) {
                    let minDist = Infinity;
                    let nearest = null;

                    sites.forEach(site => {
                        const dx = x - site.x;
                        const dy = y - site.y;
                        const dist = dx*dx + dy*dy;
                        if (dist < minDist) {
                            minDist = dist;
                            nearest = site;
                        }
                    });

                    if (nearest) {
                        const alpha = 0.15 + Math.sin(performance.now() * 0.001 + minDist * 0.0001) * 0.05;
                        ctx.fillStyle = nearest.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
                        ctx.fillRect(x, y, gridSize, gridSize);
                    }
                }
            }
        }

        // Main render loop
        function render() {
            const now = performance.now();
            frameCount++;

            if (now - lastTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastTime = now;
                document.getElementById('fps').textContent = fps;
            }

            // Clear with fade effect
            ctx.fillStyle = 'rgba(10, 10, 15, 0.3)';
            ctx.fillRect(0, 0, width, height);

            // Update points
            points.forEach(p => p.update());

            // Get point positions
            const sites = points.map(p => ({ x: p.x, y: p.y, color: p.color }));

            // Render filled cells
            if (showFill) {
                renderVoronoiCells(sites);
            }

            // Compute and render Voronoi edges
            const { edges } = computeVoronoi(sites);

            edges.forEach(edge => {
                const clipped = clipLine(edge.start.x, edge.start.y, edge.end.x, edge.end.y);
                if (clipped.visible) {
                    // Blend colors of adjacent cells
                    const color = edge.left.color;
                    drawGlowLine(clipped.x1, clipped.y1, clipped.x2, clipped.y2, color, 1.5);
                }
            });

            // Render Delaunay triangulation
            if (showDelaunay) {
                const delaunayEdges = computeDelaunayEdges(sites);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.lineWidth = 0.5;

                delaunayEdges.forEach(([i, j]) => {
                    ctx.beginPath();
                    ctx.moveTo(sites[i].x, sites[i].y);
                    ctx.lineTo(sites[j].x, sites[j].y);
                    ctx.stroke();
                });
            }

            // Render seed points
            sites.forEach(site => {
                ctx.save();
                if (showGlow) {
                    ctx.shadowColor = site.color;
                    ctx.shadowBlur = 10;
                }
                ctx.fillStyle = site.color;
                ctx.beginPath();
                ctx.arc(site.x, site.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            document.getElementById('pointCount').textContent = points.length;

            requestAnimationFrame(render);
        }

        // Event handlers
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            points.push(new Point(x, y));
        });

        let isDragging = false;
        canvas.addEventListener('mousedown', () => isDragging = true);
        canvas.addEventListener('mouseup', () => isDragging = false);
        canvas.addEventListener('mouseleave', () => isDragging = false);

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                if (Math.random() > 0.7) {
                    points.push(new Point(x, y));
                }
            }
        });

        // Control buttons
        document.getElementById('toggleDelaunay').addEventListener('click', function() {
            showDelaunay = !showDelaunay;
            this.classList.toggle('active', showDelaunay);
        });

        document.getElementById('toggleGlow').addEventListener('click', function() {
            showGlow = !showGlow;
            this.classList.toggle('active', !showGlow);
        });

        document.getElementById('toggleFill').addEventListener('click', function() {
            showFill = !showFill;
            this.classList.toggle('active', !showFill);
        });

        document.getElementById('reset').addEventListener('click', () => {
            init();
        });

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            points.push(new Point(x, y));
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            if (Math.random() > 0.7) {
                points.push(new Point(x, y));
            }
        });

        // Initialize and start
        init();
        render();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Waveform Visualizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            padding: 20px 30px;
            background: rgba(10, 10, 15, 0.85);
            border: 1px solid rgba(5, 217, 232, 0.3);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .control-group label {
            color: #05d9e8;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(5, 217, 232, 0.5);
        }

        .control-group input[type="range"] {
            -webkit-appearance: none;
            width: 120px;
            height: 4px;
            background: linear-gradient(90deg, #ff2a6d, #05d9e8);
            border-radius: 2px;
            outline: none;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 42, 109, 0.8), 0 0 30px rgba(5, 217, 232, 0.5);
        }

        .control-group select {
            background: rgba(10, 10, 15, 0.9);
            border: 1px solid rgba(5, 217, 232, 0.5);
            color: #05d9e8;
            padding: 8px 15px;
            border-radius: 6px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }

        .control-group select:hover {
            border-color: #ff2a6d;
            box-shadow: 0 0 10px rgba(255, 42, 109, 0.3);
        }

        .value-display {
            color: #ff2a6d;
            font-size: 12px;
            text-shadow: 0 0 8px rgba(255, 42, 109, 0.5);
        }

        .title {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 24px;
            letter-spacing: 8px;
            text-transform: uppercase;
            text-shadow:
                0 0 10px #ff2a6d,
                0 0 20px #ff2a6d,
                0 0 40px #ff2a6d,
                0 0 80px #05d9e8;
            z-index: 100;
            opacity: 0.9;
        }

        .subtitle {
            position: fixed;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            color: #05d9e8;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.6;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="title">Waveform</div>
    <div class="subtitle">Sound Made Visible</div>

    <canvas id="canvas"></canvas>

    <div class="controls">
        <div class="control-group">
            <label>Frequency</label>
            <input type="range" id="frequency" min="0.5" max="5" step="0.1" value="1.5">
            <span class="value-display" id="freqValue">1.5 Hz</span>
        </div>
        <div class="control-group">
            <label>Amplitude</label>
            <input type="range" id="amplitude" min="20" max="200" step="5" value="80">
            <span class="value-display" id="ampValue">80 px</span>
        </div>
        <div class="control-group">
            <label>Waveform</label>
            <select id="waveType">
                <option value="mixed">Mixed</option>
                <option value="sine">Sine</option>
                <option value="square">Square</option>
                <option value="sawtooth">Sawtooth</option>
                <option value="triangle">Triangle</option>
            </select>
        </div>
        <div class="control-group">
            <label>Layers</label>
            <input type="range" id="layers" min="3" max="12" step="1" value="6">
            <span class="value-display" id="layerValue">6</span>
        </div>
        <div class="control-group">
            <label>Speed</label>
            <input type="range" id="speed" min="0.2" max="3" step="0.1" value="1">
            <span class="value-display" id="speedValue">1.0x</span>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let time = 0;

        // Controls
        let frequency = 1.5;
        let amplitude = 80;
        let waveType = 'mixed';
        let layerCount = 6;
        let speed = 1;

        // Colors
        const colors = {
            primary: '#ff2a6d',
            secondary: '#05d9e8',
            accent1: '#d300c5',
            accent2: '#7b2dff',
            accent3: '#00ff9f'
        };

        // Wave configurations
        const waves = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initWaves();
        }

        function initWaves() {
            waves.length = 0;
            const colorArray = Object.values(colors);

            for (let i = 0; i < layerCount; i++) {
                waves.push({
                    frequency: frequency * (0.5 + i * 0.3),
                    amplitude: amplitude * (1 - i * 0.08),
                    phase: (i * Math.PI) / layerCount,
                    speed: speed * (0.7 + i * 0.1),
                    color: colorArray[i % colorArray.length],
                    type: waveType === 'mixed' ? ['sine', 'square', 'sawtooth', 'triangle'][i % 4] : waveType,
                    yOffset: height / 2 + (i - layerCount / 2) * 30,
                    thickness: 3 - i * 0.15,
                    opacity: 1 - i * 0.08
                });
            }
        }

        function getWaveValue(x, wave, t) {
            const freq = wave.frequency;
            const phase = wave.phase + t * wave.speed;
            const normalized = (x / width) * Math.PI * 2 * freq + phase;

            switch (wave.type) {
                case 'sine':
                    return Math.sin(normalized);
                case 'square':
                    return Math.sign(Math.sin(normalized)) * 0.8;
                case 'sawtooth':
                    const sawVal = ((normalized % (Math.PI * 2)) / Math.PI) - 1;
                    return sawVal;
                case 'triangle':
                    const triVal = Math.asin(Math.sin(normalized)) / (Math.PI / 2);
                    return triVal;
                default:
                    return Math.sin(normalized);
            }
        }

        function drawWave(wave, index) {
            ctx.beginPath();
            ctx.strokeStyle = wave.color;
            ctx.lineWidth = wave.thickness;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Set up glow
            ctx.shadowColor = wave.color;
            ctx.shadowBlur = 20 + Math.sin(time * 2 + index) * 5;
            ctx.globalAlpha = wave.opacity;

            const step = 2;
            let firstPoint = true;

            for (let x = 0; x <= width; x += step) {
                // Add some noise/modulation for organic feel
                const noise = Math.sin(x * 0.01 + time * 0.5) * 10;
                const modulation = Math.sin(time * 0.3 + index) * 15;

                const waveValue = getWaveValue(x, wave, time);
                const y = wave.yOffset + waveValue * wave.amplitude + noise + modulation;

                if (firstPoint) {
                    ctx.moveTo(x, y);
                    firstPoint = false;
                } else {
                    ctx.lineTo(x, y);
                }
            }

            ctx.stroke();

            // Draw second pass for extra glow
            ctx.shadowBlur = 40;
            ctx.globalAlpha = wave.opacity * 0.3;
            ctx.stroke();

            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        function drawBackground() {
            // Create gradient background
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#0a0a0f');
            gradient.addColorStop(0.5, '#0d0d15');
            gradient.addColorStop(1, '#0a0a0f');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Draw grid lines
            ctx.strokeStyle = 'rgba(5, 217, 232, 0.05)';
            ctx.lineWidth = 1;

            // Horizontal lines
            for (let y = 0; y < height; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            // Vertical lines
            for (let x = 0; x < width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            // Center line
            ctx.strokeStyle = 'rgba(255, 42, 109, 0.15)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, height / 2);
            ctx.lineTo(width, height / 2);
            ctx.stroke();
        }

        function drawFrequencyBars() {
            const barCount = 64;
            const barWidth = width / barCount;

            ctx.globalAlpha = 0.3;

            for (let i = 0; i < barCount; i++) {
                const x = i * barWidth;
                const freqValue = Math.abs(Math.sin(i * 0.2 + time * 2) * Math.cos(i * 0.1 - time));
                const barHeight = freqValue * 100;

                const gradient = ctx.createLinearGradient(x, height, x, height - barHeight);
                gradient.addColorStop(0, 'rgba(255, 42, 109, 0.8)');
                gradient.addColorStop(1, 'rgba(5, 217, 232, 0.2)');

                ctx.fillStyle = gradient;
                ctx.fillRect(x, height - barHeight - 100, barWidth - 2, barHeight);

                // Mirror on top
                const topGradient = ctx.createLinearGradient(x, 0, x, barHeight);
                topGradient.addColorStop(0, 'rgba(5, 217, 232, 0.2)');
                topGradient.addColorStop(1, 'rgba(255, 42, 109, 0.8)');

                ctx.fillStyle = topGradient;
                ctx.fillRect(x, 100, barWidth - 2, barHeight);
            }

            ctx.globalAlpha = 1;
        }

        function drawParticles() {
            const particleCount = 50;
            ctx.globalAlpha = 0.6;

            for (let i = 0; i < particleCount; i++) {
                const x = (i / particleCount) * width + Math.sin(time + i) * 20;
                const baseY = height / 2;
                const waveInfluence = waves.length > 0 ? getWaveValue(x, waves[0], time) * waves[0].amplitude : 0;
                const y = baseY + waveInfluence + Math.sin(time * 2 + i * 0.5) * 30;

                const size = 2 + Math.sin(time * 3 + i) * 1.5;
                const color = i % 2 === 0 ? colors.primary : colors.secondary;

                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = 15;
                ctx.fill();
            }

            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
        }

        function animate() {
            time += 0.016 * speed;

            drawBackground();
            drawFrequencyBars();

            // Draw waves from back to front
            for (let i = waves.length - 1; i >= 0; i--) {
                drawWave(waves[i], i);
            }

            drawParticles();

            requestAnimationFrame(animate);
        }

        // Event listeners for controls
        document.getElementById('frequency').addEventListener('input', (e) => {
            frequency = parseFloat(e.target.value);
            document.getElementById('freqValue').textContent = frequency.toFixed(1) + ' Hz';
            initWaves();
        });

        document.getElementById('amplitude').addEventListener('input', (e) => {
            amplitude = parseFloat(e.target.value);
            document.getElementById('ampValue').textContent = amplitude + ' px';
            initWaves();
        });

        document.getElementById('waveType').addEventListener('change', (e) => {
            waveType = e.target.value;
            initWaves();
        });

        document.getElementById('layers').addEventListener('input', (e) => {
            layerCount = parseInt(e.target.value);
            document.getElementById('layerValue').textContent = layerCount;
            initWaves();
        });

        document.getElementById('speed').addEventListener('input', (e) => {
            speed = parseFloat(e.target.value);
            document.getElementById('speedValue').textContent = speed.toFixed(1) + 'x';
            initWaves();
        });

        // Initialize
        window.addEventListener('resize', resize);
        resize();
        animate();
    </script>
</body>
</html>

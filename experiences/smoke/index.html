<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Vapor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        .info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-family: 'Courier New', monospace;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="smoke"></canvas>
    <div class="info">move to create vapor</div>

    <script>
        const canvas = document.getElementById('smoke');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        let mouse = { x: null, y: null, prevX: null, prevY: null };
        let lastTime = 0;
        let emitters = [];

        // Neon colors
        const colors = [
            { r: 255, g: 42, b: 109 },   // #ff2a6d - hot pink
            { r: 5, g: 217, b: 232 },     // #05d9e8 - cyan
            { r: 211, g: 0, b: 197 }      // #d300c5 - magenta
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        resize();
        window.addEventListener('resize', resize);

        // Simplex-like noise for organic movement
        class NoiseGenerator {
            constructor() {
                this.perm = [];
                for (let i = 0; i < 256; i++) {
                    this.perm[i] = Math.floor(Math.random() * 256);
                }
                for (let i = 0; i < 256; i++) {
                    this.perm[256 + i] = this.perm[i];
                }
            }

            fade(t) {
                return t * t * t * (t * (t * 6 - 15) + 10);
            }

            lerp(a, b, t) {
                return a + t * (b - a);
            }

            grad(hash, x, y) {
                const h = hash & 3;
                const u = h < 2 ? x : y;
                const v = h < 2 ? y : x;
                return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
            }

            noise(x, y) {
                const X = Math.floor(x) & 255;
                const Y = Math.floor(y) & 255;
                x -= Math.floor(x);
                y -= Math.floor(y);
                const u = this.fade(x);
                const v = this.fade(y);
                const A = this.perm[X] + Y;
                const B = this.perm[X + 1] + Y;
                return this.lerp(
                    this.lerp(this.grad(this.perm[A], x, y), this.grad(this.perm[B], x - 1, y), u),
                    this.lerp(this.grad(this.perm[A + 1], x, y - 1), this.grad(this.perm[B + 1], x - 1, y - 1), u),
                    v
                );
            }
        }

        const noise = new NoiseGenerator();

        class SmokeParticle {
            constructor(x, y, color, velocity = null) {
                this.x = x;
                this.y = y;
                this.originX = x;
                this.color = { ...color };

                // Size varies for billowing effect
                this.baseRadius = Math.random() * 25 + 15;
                this.radius = this.baseRadius;
                this.maxRadius = this.baseRadius * 3;

                // Lifetime
                this.life = 1;
                this.decay = 0.003 + Math.random() * 0.004;

                // Velocity - rises up with some horizontal drift
                if (velocity) {
                    this.vx = velocity.x * 0.3 + (Math.random() - 0.5) * 0.5;
                    this.vy = velocity.y * 0.3 - Math.random() * 1.5 - 0.5;
                } else {
                    this.vx = (Math.random() - 0.5) * 0.8;
                    this.vy = -Math.random() * 2 - 0.5;
                }

                // Noise offset for organic movement
                this.noiseOffsetX = Math.random() * 1000;
                this.noiseOffsetY = Math.random() * 1000;
                this.noiseScale = 0.003;
                this.time = 0;

                // Rotation for visual variation
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.02;

                // Turbulence
                this.turbulence = Math.random() * 0.5 + 0.5;
            }

            update(deltaTime) {
                this.time += deltaTime * 0.001;

                // Noise-based movement for organic swirling
                const noiseX = noise.noise(
                    this.x * this.noiseScale + this.noiseOffsetX,
                    this.time * 0.5
                ) * 2;
                const noiseY = noise.noise(
                    this.y * this.noiseScale + this.noiseOffsetY,
                    this.time * 0.5
                );

                // Apply forces
                this.vx += noiseX * 0.1 * this.turbulence;
                this.vy += noiseY * 0.05 - 0.02; // Slight upward buoyancy

                // Damping
                this.vx *= 0.99;
                this.vy *= 0.99;

                // Update position
                this.x += this.vx;
                this.y += this.vy;

                // Expand as smoke rises
                this.radius = this.baseRadius + (1 - this.life) * (this.maxRadius - this.baseRadius);

                // Rotation
                this.rotation += this.rotationSpeed;

                // Decay
                this.life -= this.decay;

                return this.life > 0;
            }

            draw(ctx) {
                if (this.life <= 0) return;

                const alpha = this.life * 0.4;

                // Create radial gradient for soft edges
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.radius
                );

                const { r, g, b } = this.color;
                gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha * 0.8})`);
                gradient.addColorStop(0.3, `rgba(${r}, ${g}, ${b}, ${alpha * 0.5})`);
                gradient.addColorStop(0.6, `rgba(${r}, ${g}, ${b}, ${alpha * 0.2})`);
                gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.translate(-this.x, -this.y);

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                ctx.restore();
            }
        }

        // Ambient emitter at bottom
        class Emitter {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.rate = 0.1;
                this.accumulator = 0;
            }

            update(deltaTime) {
                this.accumulator += this.rate * deltaTime * 0.01;

                while (this.accumulator >= 1) {
                    this.accumulator -= 1;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    particles.push(new SmokeParticle(
                        this.x + (Math.random() - 0.5) * 50,
                        this.y + Math.random() * 20,
                        color
                    ));
                }
            }
        }

        // Create ambient emitters
        function createEmitters() {
            emitters = [];
            const count = Math.floor(width / 300);
            for (let i = 0; i <= count; i++) {
                const x = (width / (count + 1)) * (i + 1);
                emitters.push(new Emitter(x, height + 20));
            }
        }

        createEmitters();
        window.addEventListener('resize', createEmitters);

        // Mouse interaction
        function handleMouseMove(e) {
            mouse.prevX = mouse.x;
            mouse.prevY = mouse.y;
            mouse.x = e.clientX;
            mouse.y = e.clientY;

            if (mouse.prevX !== null) {
                const dx = mouse.x - mouse.prevX;
                const dy = mouse.y - mouse.prevY;
                const speed = Math.sqrt(dx * dx + dy * dy);

                // Create particles based on movement
                const count = Math.min(Math.floor(speed / 5) + 1, 5);
                for (let i = 0; i < count; i++) {
                    const t = i / count;
                    const px = mouse.prevX + dx * t + (Math.random() - 0.5) * 20;
                    const py = mouse.prevY + dy * t + (Math.random() - 0.5) * 20;
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    particles.push(new SmokeParticle(px, py, color, { x: dx * 0.1, y: dy * 0.1 }));
                }
            }
        }

        function handleTouchMove(e) {
            e.preventDefault();
            const touch = e.touches[0];
            handleMouseMove({ clientX: touch.clientX, clientY: touch.clientY });
        }

        canvas.addEventListener('mousemove', handleMouseMove);
        canvas.addEventListener('touchmove', handleTouchMove, { passive: false });

        // Animation loop
        function animate(currentTime) {
            const deltaTime = currentTime - lastTime;
            lastTime = currentTime;

            // Semi-transparent clear for trailing effect
            ctx.fillStyle = 'rgba(10, 10, 15, 0.15)';
            ctx.fillRect(0, 0, width, height);

            // Set blend mode for color mixing
            ctx.globalCompositeOperation = 'screen';

            // Update emitters
            emitters.forEach(emitter => emitter.update(deltaTime));

            // Update and draw particles
            particles = particles.filter(p => p.update(deltaTime));

            // Limit particles for performance
            if (particles.length > 500) {
                particles = particles.slice(-500);
            }

            particles.forEach(p => p.draw(ctx));

            // Reset blend mode
            ctx.globalCompositeOperation = 'source-over';

            requestAnimationFrame(animate);
        }

        // Start animation
        requestAnimationFrame(animate);

        // Initial burst
        setTimeout(() => {
            for (let i = 0; i < 30; i++) {
                const x = width / 2 + (Math.random() - 0.5) * 200;
                const y = height * 0.7 + (Math.random() - 0.5) * 100;
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new SmokeParticle(x, y, color));
            }
        }, 100);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Orbital Mechanics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0f;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #05d9e8;
            font-size: 14px;
            text-shadow: 0 0 10px #05d9e8;
            pointer-events: none;
            z-index: 10;
        }

        #instructions {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #ff2a6d;
            font-size: 12px;
            text-shadow: 0 0 8px #ff2a6d;
            opacity: 0.8;
        }

        #title {
            position: fixed;
            top: 20px;
            right: 20px;
            color: #ff2a6d;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px #ff2a6d, 0 0 40px #ff2a6d;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="ui">
        <div id="stats">Bodies: <span id="bodyCount">0</span></div>
        <div>FPS: <span id="fps">60</span></div>
    </div>
    <div id="title">ORBITAL DYNAMICS</div>
    <div id="instructions">Click + drag to launch satellites | Scroll to zoom</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        let zoom = 1;
        let offsetX = 0, offsetY = 0;

        // Gravitational constant (scaled for simulation)
        const G = 500;

        // Neon color palette
        const neonColors = [
            '#ff2a6d', // Hot pink
            '#05d9e8', // Cyan
            '#ff6b35', // Orange
            '#9d4edd', // Purple
            '#00ff87', // Green
            '#fff01f', // Yellow
            '#ff007f', // Magenta
            '#00d4ff', // Light blue
        ];

        // Bodies in the system
        let bodies = [];

        // Trail particles
        const maxTrailLength = 150;

        // Mouse state for launching
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let dragEnd = { x: 0, y: 0 };

        // FPS tracking
        let frameCount = 0;
        let lastFPSUpdate = performance.now();
        let currentFPS = 60;

        class CelestialBody {
            constructor(x, y, vx, vy, mass, radius, color, isStar = false) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.mass = mass;
                this.radius = radius;
                this.color = color;
                this.isStar = isStar;
                this.trail = [];
                this.glowIntensity = 1;
                this.pulsePhase = Math.random() * Math.PI * 2;
            }

            update(dt, allBodies) {
                if (this.isStar) return; // Star doesn't move

                // Calculate gravitational forces from all other bodies
                let ax = 0, ay = 0;

                for (const other of allBodies) {
                    if (other === this) continue;

                    const dx = other.x - this.x;
                    const dy = other.y - this.y;
                    const distSq = dx * dx + dy * dy;
                    const dist = Math.sqrt(distSq);

                    // Prevent division by zero and extreme forces
                    if (dist < this.radius + other.radius) continue;

                    // F = G * m1 * m2 / r^2
                    const force = G * other.mass / distSq;

                    ax += force * dx / dist;
                    ay += force * dy / dist;
                }

                // Update velocity
                this.vx += ax * dt;
                this.vy += ay * dt;

                // Update position
                this.x += this.vx * dt;
                this.y += this.vy * dt;

                // Update trail
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > maxTrailLength) {
                    this.trail.shift();
                }

                // Update pulse
                this.pulsePhase += dt * 2;
                this.glowIntensity = 0.8 + 0.2 * Math.sin(this.pulsePhase);
            }

            draw(ctx) {
                const screenX = (this.x - offsetX) * zoom + centerX;
                const screenY = (this.y - offsetY) * zoom + centerY;
                const screenRadius = this.radius * zoom;

                // Draw trail
                if (this.trail.length > 1) {
                    ctx.beginPath();
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = Math.max(1, screenRadius * 0.3);
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';

                    for (let i = 0; i < this.trail.length; i++) {
                        const point = this.trail[i];
                        const px = (point.x - offsetX) * zoom + centerX;
                        const py = (point.y - offsetY) * zoom + centerY;

                        if (i === 0) {
                            ctx.moveTo(px, py);
                        } else {
                            ctx.lineTo(px, py);
                        }
                    }

                    // Gradient for trail fade
                    ctx.globalAlpha = 0.6;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 10 * zoom;
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                }

                // Draw glow layers
                const glowRadius = screenRadius * 3 * this.glowIntensity;
                const gradient = ctx.createRadialGradient(
                    screenX, screenY, screenRadius * 0.5,
                    screenX, screenY, glowRadius
                );
                gradient.addColorStop(0, this.color + 'aa');
                gradient.addColorStop(0.3, this.color + '44');
                gradient.addColorStop(1, this.color + '00');

                ctx.beginPath();
                ctx.arc(screenX, screenY, glowRadius, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();

                // Draw body
                ctx.beginPath();
                ctx.arc(screenX, screenY, screenRadius, 0, Math.PI * 2);

                if (this.isStar) {
                    // Star has intense core
                    const starGradient = ctx.createRadialGradient(
                        screenX, screenY, 0,
                        screenX, screenY, screenRadius
                    );
                    starGradient.addColorStop(0, '#ffffff');
                    starGradient.addColorStop(0.3, this.color);
                    starGradient.addColorStop(1, this.color + '88');
                    ctx.fillStyle = starGradient;
                } else {
                    ctx.fillStyle = this.color;
                }

                ctx.shadowColor = this.color;
                ctx.shadowBlur = 20 * this.glowIntensity;
                ctx.fill();
                ctx.shadowBlur = 0;

                // Inner highlight
                ctx.beginPath();
                ctx.arc(screenX - screenRadius * 0.3, screenY - screenRadius * 0.3,
                        screenRadius * 0.2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.fill();
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        function initSolarSystem() {
            bodies = [];

            // Central star
            const star = new CelestialBody(0, 0, 0, 0, 10000, 40, '#ff2a6d', true);
            bodies.push(star);

            // Create planets with proper elliptical orbits
            const planets = [
                { distance: 100, mass: 10, radius: 6, color: '#05d9e8', eccentricity: 0.1 },
                { distance: 160, mass: 15, radius: 8, color: '#ff6b35', eccentricity: 0.15 },
                { distance: 230, mass: 25, radius: 12, color: '#9d4edd', eccentricity: 0.05 },
                { distance: 320, mass: 20, radius: 10, color: '#00ff87', eccentricity: 0.2 },
                { distance: 420, mass: 80, radius: 20, color: '#fff01f', eccentricity: 0.08 },
                { distance: 550, mass: 60, radius: 16, color: '#00d4ff', eccentricity: 0.12 },
            ];

            planets.forEach((p, i) => {
                // Start at perihelion (closest point)
                const angle = (i * Math.PI * 2 / planets.length) + Math.random() * 0.5;
                const r = p.distance * (1 - p.eccentricity);
                const x = r * Math.cos(angle);
                const y = r * Math.sin(angle);

                // Calculate orbital velocity for elliptical orbit
                // v = sqrt(GM * (2/r - 1/a)) where a is semi-major axis
                const semiMajorAxis = p.distance;
                const v = Math.sqrt(G * star.mass * (2 / r - 1 / semiMajorAxis));

                // Velocity perpendicular to radius
                const vx = -v * Math.sin(angle);
                const vy = v * Math.cos(angle);

                const planet = new CelestialBody(x, y, vx, vy, p.mass, p.radius, p.color);
                bodies.push(planet);
            });

            // Add some moons
            addMoon(bodies[3], 25, 2, 3, '#ff007f'); // Moon for 3rd planet
            addMoon(bodies[5], 40, 3, 4, '#05d9e8'); // Moon for Jupiter-like
            addMoon(bodies[5], 60, 2, 3, '#ff2a6d'); // Second moon
        }

        function addMoon(planet, distance, mass, radius, color) {
            const angle = Math.random() * Math.PI * 2;
            const x = planet.x + distance * Math.cos(angle);
            const y = planet.y + distance * Math.sin(angle);

            // Orbital velocity around planet + planet's velocity
            const v = Math.sqrt(G * planet.mass / distance) * 0.5;
            const vx = planet.vx - v * Math.sin(angle);
            const vy = planet.vy + v * Math.cos(angle);

            const moon = new CelestialBody(x, y, vx, vy, mass, radius, color);
            bodies.push(moon);
        }

        function screenToWorld(screenX, screenY) {
            return {
                x: (screenX - centerX) / zoom + offsetX,
                y: (screenY - centerY) / zoom + offsetY
            };
        }

        function launchSatellite(startX, startY, endX, endY) {
            const start = screenToWorld(startX, startY);
            const end = screenToWorld(endX, endY);

            // Velocity based on drag distance
            const vx = (end.x - start.x) * 0.1;
            const vy = (end.y - start.y) * 0.1;

            const colorIndex = Math.floor(Math.random() * neonColors.length);
            const mass = 5 + Math.random() * 10;
            const radius = 3 + Math.random() * 4;

            const satellite = new CelestialBody(
                start.x, start.y, vx, vy,
                mass, radius,
                neonColors[colorIndex]
            );

            bodies.push(satellite);
        }

        function drawLaunchPreview() {
            if (!isDragging) return;

            ctx.beginPath();
            ctx.moveTo(dragStart.x, dragStart.y);
            ctx.lineTo(dragEnd.x, dragEnd.y);
            ctx.strokeStyle = '#05d9e8';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.shadowColor = '#05d9e8';
            ctx.shadowBlur = 10;
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.shadowBlur = 0;

            // Draw arrowhead
            const angle = Math.atan2(dragEnd.y - dragStart.y, dragEnd.x - dragStart.x);
            const arrowSize = 15;
            ctx.beginPath();
            ctx.moveTo(dragEnd.x, dragEnd.y);
            ctx.lineTo(
                dragEnd.x - arrowSize * Math.cos(angle - Math.PI / 6),
                dragEnd.y - arrowSize * Math.sin(angle - Math.PI / 6)
            );
            ctx.lineTo(
                dragEnd.x - arrowSize * Math.cos(angle + Math.PI / 6),
                dragEnd.y - arrowSize * Math.sin(angle + Math.PI / 6)
            );
            ctx.closePath();
            ctx.fillStyle = '#05d9e8';
            ctx.shadowColor = '#05d9e8';
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw satellite preview
            ctx.beginPath();
            ctx.arc(dragStart.x, dragStart.y, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#ff2a6d';
            ctx.shadowColor = '#ff2a6d';
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function drawStarfield() {
            // Static starfield (seeded)
            const starCount = 200;
            for (let i = 0; i < starCount; i++) {
                const seed = i * 9973;
                const x = ((seed * 7919) % width);
                const y = ((seed * 7907) % height);
                const brightness = 0.3 + ((seed * 7901) % 100) / 100 * 0.7;
                const size = 0.5 + ((seed * 7883) % 100) / 100 * 1.5;

                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${brightness})`;
                ctx.fill();
            }
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(5, 217, 232, 0.1)';
            ctx.lineWidth = 1;

            const gridSize = 100 * zoom;
            const startX = (centerX % gridSize);
            const startY = (centerY % gridSize);

            for (let x = startX; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            for (let y = startY; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
        }

        function update(dt) {
            // Update all bodies
            for (const body of bodies) {
                body.update(dt, bodies);
            }

            // Remove bodies that are too far
            bodies = bodies.filter(body => {
                if (body.isStar) return true;
                const dist = Math.sqrt(body.x * body.x + body.y * body.y);
                return dist < 2000;
            });
        }

        function draw() {
            // Clear with dark background
            ctx.fillStyle = '#0a0a0f';
            ctx.fillRect(0, 0, width, height);

            // Draw starfield
            drawStarfield();

            // Draw grid
            drawGrid();

            // Draw all bodies (star last for proper layering)
            const sortedBodies = [...bodies].sort((a, b) => {
                if (a.isStar) return 1;
                if (b.isStar) return -1;
                return 0;
            });

            for (const body of sortedBodies) {
                body.draw(ctx);
            }

            // Draw launch preview
            drawLaunchPreview();

            // Update UI
            document.getElementById('bodyCount').textContent = bodies.length;
        }

        let lastTime = performance.now();

        function animate(currentTime) {
            const dt = Math.min((currentTime - lastTime) / 1000, 0.1) * 2; // Time scaling
            lastTime = currentTime;

            // FPS calculation
            frameCount++;
            if (currentTime - lastFPSUpdate >= 1000) {
                currentFPS = frameCount;
                frameCount = 0;
                lastFPSUpdate = currentTime;
                document.getElementById('fps').textContent = currentFPS;
            }

            update(dt);
            draw();

            requestAnimationFrame(animate);
        }

        // Event listeners
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            dragStart = { x: e.clientX, y: e.clientY };
            dragEnd = { x: e.clientX, y: e.clientY };
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                dragEnd = { x: e.clientX, y: e.clientY };
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (isDragging) {
                launchSatellite(dragStart.x, dragStart.y, e.clientX, e.clientY);
                isDragging = false;
            }
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
            zoom = Math.max(0.2, Math.min(3, zoom * zoomFactor));
        });

        // Touch support
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            isDragging = true;
            dragStart = { x: touch.clientX, y: touch.clientY };
            dragEnd = { x: touch.clientX, y: touch.clientY };
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (isDragging && e.touches.length === 1) {
                const touch = e.touches[0];
                dragEnd = { x: touch.clientX, y: touch.clientY };
            }
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (isDragging) {
                launchSatellite(dragStart.x, dragStart.y, dragEnd.x, dragEnd.y);
                isDragging = false;
            }
        });

        window.addEventListener('resize', resize);

        // Initialize
        resize();
        initSolarSystem();
        animate(performance.now());
    </script>
</body>
</html>
